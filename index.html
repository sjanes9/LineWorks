<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Linework Diagrams</title>
<style>
/* ================= DESIGN TOKENS (single source of truth) ================= */
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel-2:#f6f7f9; --hover:#eef2f8;
  --border:#dde1e7; --border-strong:#c3c9d3;
  --text:#1f2430; --text-2:#576070; --text-3:#6b7280;
  --accent:#2f6fed; --accent-2:#e7effe; --accent-text:#ffffff;
  --soon-bg:#fff1d6; --soon-text:#8a5a00;
  --danger:#d93838;
  --canvas:#ffffff; --pasteboard:#e8ebf0; --grid-minor:#f0f2f5; --grid-major:#e2e6ec;
  --sel:#2f6fed; --guide:#e5487c; --port:#2f6fed; --target:#19a974;
  --shadow:0 6px 24px rgba(20,25,40,.14);
  --menu-h:44px; --toolbar-h:40px; --pagebar-h:34px; --left-w:232px; --right-w:268px;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  --fs-xs:12px; --fs-sm:12.5px; --fs-md:13px; --fs-lg:15px;
  --z-menu:50; --z-pop:60; --z-ghost:70; --z-modal:80; --z-toast:90;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#15181d; --panel:#1d2128; --panel-2:#232831; --hover:#2a303b;
  --border:#2f3541; --border-strong:#434b59;
  --text:#e6e9ef; --text-2:#aab2c0; --text-3:#9aa3b2;
  --accent:#5b8ff9; --accent-2:#22324f; --accent-text:#ffffff;
  --soon-bg:#3b2f17; --soon-text:#f3c66b;
  --canvas:#f3f4f6; --pasteboard:#2b313b; --grid-minor:#e7e9ed; --grid-major:#d6dae1;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
/* ========================================================================= */

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:var(--fs-md)/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{display:block;flex:none}
[hidden]{display:none!important}

#app{--lw:var(--left-w);--rw:var(--right-w);display:grid;height:100vh;height:100dvh;
  grid-template-rows:var(--menu-h) var(--toolbar-h) minmax(0,1fr) var(--pagebar-h);
  grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);
  grid-template-areas:"menu menu menu" "tool tool tool" "left stage right" "pages pages pages"}
#app.no-left{--lw:0px} #app.no-right{--rw:0px}
#app.no-left #left,#app.no-right #right{display:none}

/* ---------- menubar ---------- */
#menubar{grid-area:menu;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-lg);white-space:nowrap}
.doc-meta{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.doc-title{border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:1px 4px;font-size:var(--fs-md);font-weight:600;max-width:340px;width:100%}
.doc-title:hover{border-color:var(--border)} .doc-title:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.menus{display:flex;gap:2px}
.mb{border:0;background:transparent;padding:1px 7px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text-2)}
.mb:hover,.mb.open{background:var(--hover);color:var(--text)}
.mb-right{display:flex;align-items:center;gap:6px}
.save-status{font-size:var(--fs-xs);color:var(--text-3);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.save-status.warn{color:var(--danger)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border);background:var(--panel);border-radius:var(--r-md);font-size:var(--fs-sm);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn[disabled]{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent);color:var(--accent)}
.soon{display:inline-block;font-size:10px;line-height:1;padding:3px 5px;border-radius:999px;background:var(--soon-bg);color:var(--soon-text);font-weight:600;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.btn.primary .soon{background:rgba(255,255,255,.22);color:#fff}

/* ---------- toolbar ---------- */
#toolbar{grid-area:tool;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 6px;flex:none}
.tb-label{font-size:var(--fs-xs);color:var(--text-3);margin:0 2px 0 4px;white-space:nowrap}
.tb-spacer{flex:1}
.zoom-btn{min-width:54px;justify-content:center;font-variant-numeric:tabular-nums}

/* ---------- left library ---------- */
#left{grid-area:left;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.lib-search{padding:8px;border-bottom:1px solid var(--border)}
.lib-search input{width:100%;height:30px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel-2);padding:0 8px}
.lib-search input:focus{outline:none;border-color:var(--accent)}
.lib-view{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--fs-xs);color:var(--text-2)}
.lib-view select{flex:1;min-width:0;height:26px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);font-size:var(--fs-xs);color:var(--text)}
.lib-name{display:none}
.lib-grid.mode-labeled{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mode-labeled .lib-tile{aspect-ratio:auto;flex-direction:column;gap:3px;padding:6px 4px;height:auto}
.mode-labeled .lib-tile svg{width:100%;height:46px;flex:none}
.mode-labeled .lib-name{display:block;font-size:var(--fs-xs);line-height:1.25;color:var(--text);text-align:center;overflow-wrap:anywhere}
.mode-labeled .lib-cap{display:none}
.lib-grid.mode-names{grid-template-columns:1fr;gap:0;padding:0 6px 6px}
.mode-names .lib-tile{aspect-ratio:auto;justify-content:flex-start;padding:6px 8px;height:auto;text-align:left;border-radius:var(--r-sm)}
.mode-names .lib-tile svg,.mode-names .lib-cap{display:none}
.mode-names .lib-name{display:block;font-size:var(--fs-sm);line-height:1.3;color:var(--text)}
.mode-names .lib-name small{color:var(--text-3);font-size:var(--fs-xs);margin-left:6px}
#libList{overflow-y:auto;flex:1;padding-bottom:16px;-webkit-overflow-scrolling:touch}
.lib-cat-h{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:8px 10px 6px;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);text-align:left}
.lib-cat-h .ic{transition:transform .15s}
.lib-cat:not(.collapsed) .lib-cat-h .ic{transform:rotate(90deg)}
.lib-cat.collapsed .lib-grid{display:none}
.lib-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:0 8px 6px}
.lib-tile{aspect-ratio:1/1;border:1px solid transparent;border-radius:var(--r-md);background:transparent;display:flex;align-items:center;justify-content:center;padding:4px;touch-action:pan-y;color:var(--text-2)}
.lib-tile:hover{background:var(--hover);border-color:var(--border)}
.lib-tile svg{width:100%;height:100%;pointer-events:none;overflow:visible}
.lib-tile.dev{flex-direction:column;gap:1px;padding:3px 1px}
.lib-tile.dev svg{width:100%;height:calc(100% - 11px);flex:none}
.lib-cap{font-size:8.5px;letter-spacing:-.1px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);pointer-events:none}
.lib-soon{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;border:0;background:transparent;padding:7px 10px;font-size:var(--fs-sm);color:var(--text-3);text-align:left}
.lib-soon:hover{background:var(--hover)}
.lib-soon-h{padding:12px 10px 4px;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);border-top:1px solid var(--border);margin-top:6px}
.lib-empty{padding:12px;color:var(--text-3);font-size:var(--fs-sm)}

/* ---------- stage ---------- */
#stage{grid-area:stage;position:relative;overflow:hidden;background:var(--canvas);touch-action:none;user-select:none;-webkit-user-select:none}
#svg{display:block;width:100%;height:100%;outline:none}
#stage.panning #svg,#stage.mode-pan #svg{cursor:grab} #stage.dragging #svg{cursor:grabbing}
.item.shape .body{pointer-events:all}
.item.shape{cursor:move}
.item.line .hit{pointer-events:stroke;cursor:pointer}
.item text{pointer-events:none}
.ov-sel{fill:none;stroke:var(--sel);pointer-events:none}
.ov-sel-line{fill:none;stroke:var(--sel);opacity:.28;pointer-events:none;stroke-linecap:round;stroke-linejoin:round}
.ov-group{fill:none;stroke:var(--sel);pointer-events:none}
.ov-handle{fill:#fff;stroke:var(--sel)}
.ov-rot{cursor:pointer}
.ov-rot circle{fill:#fff;stroke:var(--sel)}
.ov-rot path{stroke:var(--sel);stroke-linecap:round;stroke-linejoin:round}
.ov-rot:hover circle{fill:var(--sel)} .ov-rot:hover path{stroke:#fff}
.ov-rot-stem{stroke:var(--sel)}
.ov-handle[data-handle="nw"],.ov-handle[data-handle="se"]{cursor:nwse-resize}
.ov-handle[data-handle="ne"],.ov-handle[data-handle="sw"]{cursor:nesw-resize}
.ov-handle[data-handle="n"],.ov-handle[data-handle="s"]{cursor:ns-resize}
.ov-handle[data-handle="e"],.ov-handle[data-handle="w"]{cursor:ew-resize}
.ov-end{stroke:var(--sel);cursor:crosshair}
.ov-seg{fill:#fff;stroke:var(--sel)}
.ov-add{cursor:pointer} .ov-add circle{fill:var(--sel)} .ov-add path{stroke:#fff;stroke-linecap:round} .ov-add:hover circle{filter:brightness(1.15)} .ov-seg.hz{cursor:ns-resize} .ov-seg.vt{cursor:ew-resize}
.menu.ctx{max-height:calc(100vh - 16px);overflow-y:auto}
.ov-end.free{fill:#fff} .ov-end.attached{fill:var(--sel)}
.ov-port{cursor:crosshair}
.ov-port .vis{fill:var(--port);stroke:#fff;opacity:.85}
.ov-port:hover .vis{opacity:1}
.ov-port .pad{fill:transparent}
.ov-target{fill:rgba(25,169,116,.06);stroke:var(--target);pointer-events:none}
.ov-dot{fill:#fff;stroke:var(--target);pointer-events:none}
.ov-dot.on{fill:var(--target)}
.ov-portlab{fill:var(--text);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none;font-family:system-ui,sans-serif}
.has-sheet{background:var(--pasteboard)!important}
.sheet{filter:drop-shadow(0 1px 3px rgba(15,23,42,.18))}
.on-locked{pointer-events:none}
.layer-list{display:grid;gap:4px}
.layer-row{display:grid;grid-template-columns:22px minmax(0,1fr) 28px;gap:3px 4px;align-items:center;padding:3px;border-radius:var(--r-sm);border:1px solid transparent}
.layer-row.on{background:var(--accent-2);border-color:var(--accent)}
.layer-row input[type=text]{min-width:0;height:26px;padding:0 6px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);font-size:var(--fs-sm)}
.lay-btns{grid-column:2/-1;display:flex;gap:3px;justify-content:flex-end}
.lay-n{font-size:var(--fs-xs);color:var(--text-3);text-align:center}
.lay-act{width:22px;height:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.lay-act .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--text-3)}
.layer-row.on .lay-act .dot{background:var(--accent);border-color:var(--accent)}
.btn.icon.sm{width:26px;height:26px;padding:0;justify-content:center}
.btn.icon.sm[aria-pressed="true"]{background:var(--hover);color:var(--accent)}
.dev-ports{display:grid;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:4px 6px}
.dev-port{display:grid;grid-template-columns:44px 1fr;gap:6px;font-size:12px;line-height:1.35}
.dev-port b{font-weight:600}
.dev-port.used span{color:var(--accent)}
.ov-temp{fill:none;stroke:var(--sel);pointer-events:none;stroke-dasharray:6 4}
.ov-marquee{fill:rgba(47,111,237,.08);stroke:var(--sel);pointer-events:none}
.ov-guide{stroke:var(--guide);pointer-events:none}
.empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty-hint div{max-width:360px;text-align:center;color:#8a93a3;font-size:var(--fs-md);line-height:1.6;padding:20px;border:1.5px dashed #d3d8e0;border-radius:var(--r-lg);background:rgba(255,255,255,.7)}
.empty-hint b{color:#4c5566}
.text-editor{position:absolute;z-index:5;border:1.5px solid var(--accent);background:rgba(255,255,255,.92);border-radius:2px;resize:none;outline:none;padding:0 2px;margin:0;overflow:hidden;line-height:1.25;box-shadow:0 0 0 3px rgba(47,111,237,.15);user-select:text;-webkit-user-select:text}

/* ---------- right props ---------- */
#right{grid-area:right;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.props-title{padding:12px 12px 4px;font-weight:600;font-size:var(--fs-lg)}
.props-sub{padding:0 12px 6px;color:var(--text-3);font-size:var(--fs-xs)}
.sec{border-top:1px solid var(--border);padding:10px 12px}
.sec:first-of-type{border-top:0}
.sec-h{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;margin-bottom:4px}
.row-l{color:var(--text-2);font-size:var(--fs-sm);flex:none;width:72px}
.row-c{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end;min-width:0}
.row input[type=text],.row input[type=number],.row select{height:28px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 6px;width:100%;min-width:0}
.row input[type=number]{width:72px;flex:none}
.row input:focus,.row select:focus{outline:none;border-color:var(--accent)}
.row input[type=color]{width:34px;height:28px;padding:2px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);flex:none}
.row input[type=range]{width:100%;accent-color:var(--accent)}
.row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);color:var(--text-2);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--panel-2);height:28px;min-width:30px;padding:0 6px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border);font-size:var(--fs-sm)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent-2);color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:2px 0 8px}
.sw{aspect-ratio:1/1;border-radius:4px;border:1px solid var(--border-strong);padding:0}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px}
.geo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.geo label{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--text-2)}
.geo input{height:28px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 6px;width:100%;min-width:0}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-grid .btn{justify-content:center}
.icon-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.muted{color:var(--text-3)} .small{font-size:var(--fs-sm);margin:0}
.soon-list{display:flex;flex-direction:column;gap:6px}
.soon-row{display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-sm);color:var(--text-3)}

/* ---------- pagebar ---------- */
#pagebar{grid-area:pages;display:flex;align-items:stretch;background:var(--panel);border-top:1px solid var(--border);padding:0 6px;gap:2px}
#pageTabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none}
.ptab{display:flex;align-items:center;gap:4px;padding:0 10px;font-size:var(--fs-sm);color:var(--text-2);border-top:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none}
.ptab:hover{background:var(--hover)}
.ptab.on{color:var(--text);border-top-color:var(--accent);background:var(--panel-2);font-weight:600}
.ptab-x{border:0;background:transparent;padding:2px;border-radius:3px;display:flex;color:var(--text-3)}
.ptab-x:hover{background:var(--border);color:var(--text)}
.ptab input{height:22px;width:120px;border:1px solid var(--accent);border-radius:3px;padding:0 4px;background:var(--panel)}
.pb-add{align-self:center}
.pb-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--text-3);padding-right:6px}

/* ---------- menus, popups ---------- */
.menu{position:fixed;z-index:var(--z-menu);min-width:230px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);padding:4px}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:var(--r-sm);text-align:left;font-size:var(--fs-sm)}
.menu-item:hover{background:var(--hover)}
.pop-list{display:grid;gap:1px;max-height:300px;overflow:auto;min-width:220px}
.pop-li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:transparent;padding:6px 8px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text);text-align:left}
.pop-li small{color:var(--text-3);font-size:var(--fs-xs)}
.pop-li:hover{background:var(--hover)}
.pop-li.on{background:var(--accent-2);color:var(--accent)}
.menu-item.is-soon{color:var(--text-3)}
.mi-check{width:14px;flex:none;color:var(--accent)}
.mi-label{flex:1}
.mi-key{color:var(--text-3);font-size:var(--fs-xs)}
.menu-sep{height:1px;background:var(--border);margin:4px 2px}
.quick{position:absolute;z-index:var(--z-pop);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);padding:8px;width:212px}
.quick-h{font-size:var(--fs-xs);font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.quick-skip{margin-top:6px;width:100%;border:1px solid var(--border);background:var(--panel-2);border-radius:var(--r-sm);padding:5px;font-size:var(--fs-sm)}
.ghost-drag{position:fixed;left:0;top:0;z-index:var(--z-ghost);pointer-events:none;opacity:.75;color:#3d4757}
.ghost-drag svg{overflow:visible;display:block;transform:translate(-50%,-50%)}
.ghost-drag.over{opacity:.95}

/* ---------- floating editing bar ---------- */
.ftb{position:absolute;z-index:var(--z-pop);display:flex;flex-direction:column;align-items:flex-start}
.ftb.up{flex-direction:column-reverse}
.ftb-bar{display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.ftb-btn{width:38px;height:36px;border:0;background:transparent;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0}
.ftb-btn:hover,.ftb-btn[aria-expanded="true"]{background:var(--hover)}
.ftb-btn[aria-pressed="true"]{color:var(--accent)}
.ftb-btn[disabled]{opacity:.35;cursor:default}
.ftb-aa{font-weight:600;font-size:15px}
.ftb-sep{width:1px;height:24px;background:var(--border);margin:0 3px}
.ftb-pop{margin-top:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:12px;width:316px;max-height:500px;overflow-y:auto}
.ftb.up .ftb-pop{margin:0 0 6px}
.pop-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pop-row select{height:30px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 6px;flex:1;min-width:0}
.pop-title{font-weight:600;font-size:var(--fs-lg);margin-right:auto;margin-bottom:6px;display:block}
.pop-row .pop-title{margin-bottom:0}
.pop-sub{font-size:var(--fs-sm);color:var(--text-2);min-width:44px}
.pop-num{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 6px;height:30px;font-size:var(--fs-sm);color:var(--text-2)}

.pal-c.rc{width:26px;height:26px;border-radius:4px;border:1px solid var(--border-strong)}
.pal-add{position:relative;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px dashed var(--border-strong);border-radius:4px;font-size:18px;color:var(--text-2);cursor:pointer}
.pal-add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pop-presets{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.preset{width:28px;height:24px;border:2px solid;border-radius:4px;padding:3px 4px;display:flex;align-items:flex-end}
.preset span{display:block;width:100%;height:4px;border-radius:1px}
.ftb-mini{border:1px solid var(--border);background:var(--panel-2);border-radius:4px;width:28px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-2);padding:0}
.pop-search{width:100%;height:32px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 8px;margin-bottom:8px}
.pop-search:focus{outline:none;border-color:var(--accent)}
.pop-textbtn{border:0;background:transparent;color:var(--text-3);text-decoration:underline;font-size:var(--fs-sm);padding:2px 0;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.pop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop-actions .btn{justify-content:center;height:34px}
.pop-shapes{grid-template-columns:repeat(6,1fr)}
.lib-tile.on{background:var(--accent-2);border-color:var(--accent)}
.emo-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.emo-tab{border:0;background:transparent;font-size:17px;padding:4px 6px;border-radius:4px 4px 0 0;line-height:1.2;flex:none}
.emo-tab.on{background:var(--hover);box-shadow:inset 0 -2px 0 var(--accent)}
.emo-h{font-weight:600;margin:4px 0 6px}
.emo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.emo{border:0;background:transparent;font-size:24px;line-height:1;padding:6px 0;border-radius:6px}
.emo:hover{background:var(--hover)} .emo.on{background:var(--accent-2);box-shadow:inset 0 0 0 1.5px var(--accent)}
.badges{cursor:pointer}
.badge-pill{fill:#ffffff;stroke:#c4c9d1;stroke-width:1}
.badge-react{cursor:pointer;user-select:none}
.badge-link{fill:#ffffff;stroke:#3a7bec;stroke-width:1.2}
.badge-link-ic{color:#3a7bec;pointer-events:none}
.line-label{cursor:move}
.ov-lock rect{fill:var(--panel);stroke:var(--border-strong)} .ov-lock path{stroke:var(--text-2)} .ov-lock{pointer-events:none}
.lock-note{display:flex;align-items:center;gap:8px;margin:4px 12px 8px;padding:8px;border-radius:var(--r-md);background:var(--soon-bg);color:var(--soon-text);font-size:var(--fs-sm)}
.lock-note span{flex:1}
.react-list{display:inline-flex;gap:2px;flex-wrap:wrap;font-size:16px}

.ftb-btn.ftb-end{width:auto;padding:0 6px;gap:2px}
.ftb-btn .end-prev{display:block}
.ftb-pop.narrow{width:auto;padding:6px 0}
.end-list{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;min-width:110px}
.end-opt{border:0;background:transparent;padding:6px 14px;display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:inset 3px 0 0 transparent}
.end-opt:hover{background:var(--hover)}
.end-opt.on{box-shadow:inset 3px 0 0 var(--text);background:var(--panel-2)}
.end-none{font-size:var(--fs-md);padding:8px 14px}
.end-more{border:0;border-top:1px solid var(--border);background:transparent;padding:10px 14px;font-size:var(--fs-md);color:var(--text-2);text-align:center;width:100%}
.end-more:hover{background:var(--hover);color:var(--text)}
.tp-grid{display:grid;gap:8px;margin-bottom:8px}
.tp-2{grid-template-columns:1.5fr 1fr} .tp-3{grid-template-columns:1fr 1fr 1.6fr} .tp-4{grid-template-columns:repeat(4,1fr)} .tp-6{grid-template-columns:repeat(3,1fr) 10px repeat(3,1fr)}
.tp-6 .tp-btn:nth-child(4){grid-column:5}
.tp-grid select{height:36px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 8px;width:100%;min-width:0}
.tp-btn{height:36px;border:1px solid var(--border);background:var(--panel-2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;gap:2px;font-size:16px;color:var(--text);padding:0;position:relative}
.tp-btn:hover{background:var(--hover)}
.tp-btn[aria-pressed="true"],.tp-btn.open{background:var(--panel);border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.tp-color{flex-direction:column;gap:2px;padding-top:3px}
.tp-a{font-size:15px;line-height:1}
.tp-bar{display:block;width:70%;height:4px;border-radius:1px}
.tp-bar.tr{background:repeating-conic-gradient(#c4c9d1 0 25%,#ffffff 0 50%) 0 0/6px 6px}
.tp-sub{margin:-2px 0 10px}
.tp-sub .pal{margin-bottom:0}
.tp-edit{width:100%;justify-content:center;height:34px;margin-top:2px}
.tp-hint{margin-top:8px}
.modal.modal-le{width:min(520px,100%);height:min(700px,100%)}
.modal-le .modal-b{padding:0;display:flex;flex-direction:column;overflow:hidden;flex:1}
.le{display:flex;flex:1;min-height:0}
.le-nav{width:150px;border-right:1px solid var(--border);display:flex;flex-direction:column;padding-top:4px;flex:none}
.le-cat{border:0;background:transparent;text-align:left;padding:7px 14px;font-size:var(--fs-md);color:var(--text-2)}
.le-cat:hover{background:var(--hover)} .le-cat.on{background:var(--panel-2);color:var(--text);font-weight:700}
.le-list{flex:1;overflow-y:auto;padding:6px 14px}
.le-row{display:flex;align-items:center;gap:16px;padding:7px 4px;cursor:pointer;color:var(--text)}
.le-row:hover{background:var(--hover)}
.le-row input{width:17px;height:17px;accent-color:var(--text);flex:none}
.le-all{border-bottom:1px solid var(--border);margin-bottom:6px;padding:12px 4px}
.le-row .end-prev{flex:none}
.ftb-end .ic:last-child{transform:rotate(90deg);opacity:.7}
.le-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding:0 0 0 8px}
.le-foot .btn{height:48px;border-radius:0;padding:0 24px;font-size:var(--fs-md)}
.le-foot .btn.primary{min-width:130px;justify-content:center;background:var(--text);border-color:var(--text);color:var(--panel)}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;z-index:var(--z-modal);background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;border:1px solid var(--border)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-h h2{margin:0;font-size:var(--fs-lg)}
.modal-b{padding:6px 20px 20px;overflow-y:auto;line-height:1.55}
.modal-b h3{font-size:var(--fs-md);margin:16px 0 4px}
.io-form{display:grid;gap:10px;margin:4px 0 10px}
.io-form label{display:grid;gap:4px;font-size:var(--fs-sm);color:var(--text-2)}
.io-form select,.io-form input{height:32px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);color:var(--text);font-size:var(--fs-md)}
.io-err{color:#b42318}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.modal-b p,.modal-b li{font-size:var(--fs-md);color:var(--text-2)}
.modal-b ul{padding-left:18px;margin:4px 0}
.modal-b table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
.modal-b td{padding:4px 6px;border-bottom:1px solid var(--border)}
.modal-b td:first-child{white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text)}
.modal-b textarea{width:100%;height:300px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--fs-xs)}
#toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,20px);z-index:var(--z-toast);background:#1f2430;color:#fff;padding:8px 14px;border-radius:var(--r-md);font-size:var(--fs-sm);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){ :root{--left-w:196px;--right-w:240px} .lib-grid{grid-template-columns:repeat(3,1fr)} .brand-name{display:none} }
@media (max-width:640px){ .save-status{display:none} .menus .mb{padding:1px 5px} }
</style>

function unrotSide(X,side){

  for(const us of SIDE_KEYS){ const p=tp(X,SIDES[us].x,SIDES[us].y); if(Math.round(p.x-o.x)===t.x&&Math.round(p.y-o.y)===t.y) return us; }
  return side;
}
// How far each port sits inside the bounding box, so connectors meet the outline.
function portInset(type,w,h){
  switch(type){
    case 'triangle': return {N:0,S:0,E:w*.25,W:w*.25};
    case 'parallelogram': return {N:0,S:0,E:w*.09,W:w*.09};
    case 'trapezoid': return {N:0,S:0,E:w*.075,W:w*.075};
    case 'document': return {N:0,S:h*.15,E:0,W:0};
    case 'callout': return {N:0,S:h*.25,E:0,W:0};
    case 'manualInput': return {N:h*.125,S:0,E:0,W:0};
    case 'star': return {N:0,S:h*.2,E:w*.2,W:w*.2};
    case 'arrow': return {N:h*.25,S:h*.25,E:0,W:0};
    case 'cloud': return {N:h*.03,S:h*.03,E:w*.04,W:w*.04};
    case 'pentagon': return {N:0,S:0,E:w*.04,W:w*.04};
    default: return null;
  }
}

/* ============================== containers, ER, cloud and building libraries ==============================
   libGeom returns geometry for these types in the same format as symGeom:
   {d, decor:[{d,f,dash,op,ns}], glyphs, tb, label, hit, ports}. op = fill opacity, ns = no outline. */
const CONTAINER_TYPES=new Set(['container','group_frame','lane_h','lane_v','fp_room']);
const ER_ROW=22, ER_HEAD=30, ER_KEYW=36;
function libGeom(type,w,h){
  const D=(d,f,dash,o)=>Object.assign({d,f:f||'none',dash:!!dash},o||{});
  const R=(x,y,ww,hh)=>`M${r2(x)} ${r2(y)}H${r2(x+ww)}V${r2(y+hh)}H${r2(x)}Z`;
  const RR=(x,y,ww,hh,r)=>{ r=Math.max(0,Math.min(r,ww/2,hh/2)); return `M${r2(x+r)} ${r2(y)}H${r2(x+ww-r)}Q${r2(x+ww)} ${r2(y)} ${r2(x+ww)} ${r2(y+r)}V${r2(y+hh-r)}Q${r2(x+ww)} ${r2(y+hh)} ${r2(x+ww-r)} ${r2(y+hh)}H${r2(x+r)}Q${r2(x)} ${r2(y+hh)} ${r2(x)} ${r2(y+hh-r)}V${r2(y+r)}Q${r2(x)} ${r2(y)} ${r2(x+r)} ${r2(y)}Z`; };
  const E=(cx,cy,rx,ry)=>`M${r2(cx-rx)} ${r2(cy)}A${r2(rx)} ${r2(ry)} 0 1 0 ${r2(cx+rx)} ${r2(cy)}A${r2(rx)} ${r2(ry)} 0 1 0 ${r2(cx-rx)} ${r2(cy)}Z`;
  const box=(d,o)=>Object.assign({d,decor:[],glyphs:[],tb:{x:0,y:0,w,h},label:false,hit:false,ports:null},o||{});
  const icon=(d,o)=>Object.assign({d,decor:[],glyphs:[],tb:{x:0,y:0,w,h},label:true,hit:true,ports:null},o||{});
  const m=Math.min(w,h), cx=w/2, cy=h/2;
  switch(type){
    // ---------------- containers and swimlanes ----------------
    case 'container': { const hb=Math.min(28,h*0.5);
      return box(RR(0,0,w,h,4),{decor:[D(`M0 ${r2(hb)}V4Q0 0 4 0H${r2(w-4)}Q${r2(w)} 0 ${r2(w)} 4V${r2(hb)}Z`,'stroke',false,{op:0.12,ns:true}),D(PL([0,hb],[w,hb]))],tb:{x:4,y:0,w:Math.max(8,w-8),h:hb}}); }
    case 'group_frame': return box(RR(0,0,w,h,8),{tb:{x:6,y:2,w:Math.max(8,w-12),h:Math.min(26,h)}});
    case 'lane_h': { const hw=Math.min(110,w*0.4);
      return box(R(0,0,w,h),{decor:[D(R(0,0,hw,h),'stroke',false,{op:0.1,ns:true}),D(PL([hw,0],[hw,h]))],tb:{x:0,y:0,w:hw,h}}); }
    case 'lane_v': { const hb=Math.min(36,h*0.3);
      return box(R(0,0,w,h),{decor:[D(R(0,0,w,hb),'stroke',false,{op:0.1,ns:true}),D(PL([0,hb],[w,hb]))],tb:{x:0,y:0,w,h:hb}}); }
    case 'tpl_swim_h': { const n=3, th=h*0.16, lh=(h-th)/n, hw=w*0.16; let dd=''; for(let i=1;i<n;i++) dd+=PL([0,th+lh*i],[w,th+lh*i]);
      return box(R(0,0,w,h),{decor:[D(R(0,0,w,th),'stroke',false,{op:0.18,ns:true}),D(R(0,th,hw,h-th),'stroke',false,{op:0.08,ns:true}),D(PL([0,th],[w,th])+PL([hw,th],[hw,h])+dd)]}); }
    case 'tpl_swim_v': { const n=3, th=h*0.12, lw=w/n, hb=h*0.1; let dd=''; for(let i=1;i<n;i++) dd+=PL([lw*i,th],[lw*i,h]);
      return box(R(0,0,w,h),{decor:[D(R(0,0,w,th),'stroke',false,{op:0.18,ns:true}),D(R(0,th,w,hb),'stroke',false,{op:0.08,ns:true}),D(PL([0,th],[w,th])+PL([0,th+hb],[w,th+hb])+dd)]}); }
    // ---------------- entity relationship ----------------
    case 'er_entity': { let rows=''; for(let y=ER_HEAD+ER_ROW;y<h-2;y+=ER_ROW) rows+=PL([0,y],[w,y]);
      return box(RR(0,0,w,h,3),{decor:[D(`M0 ${ER_HEAD}V3Q0 0 3 0H${r2(w-3)}Q${r2(w)} 0 ${r2(w)} 3V${ER_HEAD}Z`,'stroke',false,{op:0.14,ns:true}),D(PL([0,ER_HEAD],[w,ER_HEAD])+rows),D(PL([ER_KEYW,ER_HEAD],[ER_KEYW,h]))],tb:{x:0,y:0,w,h}}); }
    case 'er_weak': return box(R(0,0,w,h),{decor:[D(R(4,4,w-8,h-8))],tb:{x:6,y:6,w:w-12,h:h-12}});
    case 'er_wrel': return box(poly([[w/2,0],[w,h/2],[w/2,h],[0,h/2]]),{decor:[D(poly([[w/2,5],[w-8,h/2],[w/2,h-5],[8,h/2]]))],tb:{x:w*.2,y:h*.25,w:w*.6,h:h*.5}});
    case 'er_multi': return box(E(cx,cy,w/2,h/2),{decor:[D(E(cx,cy,w/2-4,h/2-4))],tb:{x:w*.16,y:h*.16,w:w*.68,h:h*.68}});
    // ---------------- cloud architecture (generic, vendor-neutral) ----------------

const isContainer=s=>isShape(s)&&CONTAINER_TYPES.has(s.type);
function insideBox(a,c){ return a!==c&&a.x>=c.x-0.5&&a.y>=c.y-0.5&&a.x+a.w<=c.x+c.w+0.5&&a.y+a.h<=c.y+c.h+0.5&&a.w*a.h<c.w*c.h; }
// Items that ride along when containers move: shapes inside a moving container, and free lines whose ends are both inside.
function carriedBy(list){
  const moving=new Set(list.map(i=>i.id)), out=[];
  let conts=list.filter(isContainer); if(!conts.length) return out;
  for(let pass=0;pass<4&&conts.length;pass++){
    const next=[];
    for(const it of items()){
      if(moving.has(it.id)||it.locked) continue;
      if(isShape(it)&&conts.some(c=>insideBox(it,c))){ out.push(it); moving.add(it.id); if(isContainer(it)) next.push(it); }
      else if(isLine(it)&&!it.from.id&&!it.to.id){ const pin=p=>conts.some(c=>p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h); if(pin(it.from)&&pin(it.to)){ out.push(it); moving.add(it.id); } }
    }
    conts=next;
  }
  return out;
}

  const grp=s.groupId?items().filter(i=>i.groupId===s.groupId):[s], lanes=grp.filter(i=>i.type===s.type);
  const hz=s.type==='lane_h', last=lanes.reduce((a,b)=>hz?(b.y>a.y?b:a):(b.x>a.x?b:a));
  const n=JSON.parse(JSON.stringify(last)); n.id=uid(); n.text='Lane '+(lanes.length+1);

const swP=(fe,ge,combo,sfp,poe,o)=>{ let n=1, a=[]; o=o||{};

  if(poe){ a=a.concat(PN(poe,'poe',n,'PoE copper, '+(o.poe||'10/100')+' Mbps')); n+=poe; }
  if(ge){ a=a.concat(PN(ge,'eth',n,'Copper, '+(o.ge||'10/100/1000')+' Mbps')); n+=ge; }
  if(combo){ a=a.concat(PN(combo,'combo',n,'Combo (RJ45 or SFP), '+(o.combo||'10/100/1000')+' Mbps')); n+=combo; }
  if(sfp){ a=a.concat(PN(sfp,'sfp',n,(o.sfpd||'SFP slot')+', '+(o.sfp||'100/1000')+' Mbps')); n+=sfp; }

function layerCmd(action,id){

  switch(action){
    case 'add': { const n=newLayer('Layer '+(ls.length+1)); ls.push(n); pg.activeLayer=n.id; break; }
    case 'active': if(L) pg.activeLayer=L.id; break;
    case 'vis': if(L){ L.visible=!L.visible; if(!L.visible||L.locked) S.sel=new Set([...S.sel].filter(x=>{ const it=byId(x); return it&&selectable(it); })); } break;
    case 'lock': if(L){ L.locked=!L.locked; S.sel=new Set([...S.sel].filter(x=>{ const it=byId(x); return it&&selectable(it); })); } break;
    case 'up': if(i<ls.length-1){ ls.splice(i,1); ls.splice(i+1,0,L); } break;
    case 'down': if(i>0){ ls.splice(i,1); ls.splice(i-1,0,L); } break;
    case 'del': {
      if(!L) return; if(ls.length<2){ toast('A page needs at least one layer.'); return; }
      const gone=new Set(pg.items.filter(it=>layerOf(it,pg)===L).map(it=>it.id));

function sanStyle(s,def){

      const v=s[k], dv=def[k];

  if('list' in o && !['none','bullet','number'].includes(o.list)) o.list='none';
  if(!DASHES.includes(o.dash)) o.dash='solid';

  if(/^[a-z][a-z0-9+.-]*:/i.test(u)){ if(!/^(https?:|mailto:)/i.test(u)) return null; } else u='https://'+u;
  try{ const x=new URL(u); if(!['http:','https:','mailto:'].includes(x.protocol)) return null; if(x.protocol!=='mailto:'&&!x.hostname.includes('.')&&x.hostname!=='localhost') return null; return x.href; }catch(e){ return null; }
}
function sanAttrs(it){
  const o={};
  if(Array.isArray(it.reactions)){ const r=[...new Set(it.reactions.filter(x=>typeof x==='string'&&x.length>0&&x.length<=16))].slice(0,12); if(r.length) o.reactions=r; }
  if(it.link){ const u=normUrl(it.link); if(u) o.link=u; }
  if(it.locked===true) o.locked=true;
  return o;
}
function sanitizeItem(it){
  if(!it||typeof it!=='object') return null;
  const id=(typeof it.id==='string'&&it.id)?it.id.slice(0,64):uid();
  const gid=(typeof it.groupId==='string'&&it.groupId)?it.groupId.slice(0,64):undefined;
  if(it.kind==='line'){
    return {id,kind:'line',from:sanEnd(it.from),to:sanEnd(it.to),
      route:ROUTES.includes(it.route)?it.route:'orthogonal',
      startArrow:ARROWS.includes(it.startArrow)?it.startArrow:'none',
      endArrow:ARROWS.includes(it.endArrow)?it.endArrow:'arrow',
      labels:sanLabels(it),style:sanStyle(it.style,DEF_LINE_STYLE),layer:typeof it.layer==='string'?it.layer.slice(0,64):undefined,groupId:gid,...sanAttrs(it),signal:SIGNALS[it.signal]?it.signal:undefined,
      waypoints:(Array.isArray(it.waypoints)&&it.waypoints.length&&it.route!=='straight'&&it.route!=='curved')?it.waypoints.slice(0,60).filter(q=>q&&Number.isFinite(+q.x)&&Number.isFinite(+q.y)).map(q=>({x:num(q.x,0),y:num(q.y,0)})):undefined};
  }
  return {id,kind:'shape',type:(GEOM_TYPES.includes(it.type)||IO_RE.test(String(it.type)))?it.type:'rect',
    x:num(it.x,0),y:num(it.y,0),w:Math.max(4,num(it.w,100)),h:Math.max(4,num(it.h,60)),
    text:str(it.text).slice(0,10000),style:sanStyle(it.style,DEF_SHAPE_STYLE),layer:typeof it.layer==='string'?it.layer.slice(0,64):undefined,groupId:gid,
    rot:[90,180,270].includes(it.rot)?it.rot:undefined,flip:it.flip===true?true:undefined,...sanAttrs(it),
    img:(it.type==='image'&&typeof it.img==='string')?it.img.slice(0,64):undefined,
    family:['mindmap','org'].includes(it.family)?it.family:undefined,
    level:['mindmap','org'].includes(it.family)&&Number.isFinite(+it.level)?clamp(Math.round(+it.level),0,20):undefined};
}
// Accepts current files, older schema-0 shapes, or a JSON string. Throws a readable error.
function migrate(raw){
  if(typeof raw==='string') raw=JSON.parse(raw);
  if(!raw||typeof raw!=='object'||Array.isArray(raw)) throw new Error('This file is not a Linework diagram.');
  let d=raw; const schema=num(d.schema,0);
  if(schema>SCHEMA) throw new Error('This file was saved by a newer version of Linework (schema '+schema+').');
  if(schema===0){
    let its=null;
    if(Array.isArray(d.items)) its=d.items;
    else if(Array.isArray(d.shapes)||Array.isArray(d.lines)) its=[...(d.shapes||[]).map(s=>Object.assign({},s,{kind:'shape'})),...(d.lines||[]).map(l=>Object.assign({},l,{kind:'line'}))];
    if(its) d={title:d.title,pages:[{name:'Page 1',items:its}]};
  }
  if(!Array.isArray(d.pages)||!d.pages.length) throw new Error('This file contains no pages.');
  const seenPages=new Set();
  const pages=d.pages.map((p,i)=>{
    p=p&&typeof p==='object'?p:{};
    const seen=new Set();
    const its=(Array.isArray(p.items)?p.items:[]).map(sanitizeItem).filter(Boolean).map(it=>{ if(seen.has(it.id)) it.id=uid(); seen.add(it.id); return it; });
    const shapeIds=new Set(its.filter(isShape).map(s=>s.id));
    for(const L of its) if(isLine(L)) for(const k of ['from','to']) if(L[k].id&&!shapeIds.has(L[k].id)) L[k]={x:0,y:0};
    let pid=(typeof p.id==='string'&&p.id)?p.id:uid(); if(seenPages.has(pid)) pid=uid(); seenPages.add(pid);
    return Object.assign({id:pid,name:str(p.name).slice(0,80)||('Page '+(i+1)),items:its},sanPageExtras(p,its));
  });
  const active=pages.some(p=>p.id===d.activePage)?d.activePage:pages[0].id;
  return {schema:SCHEMA,app:'linework',title:str(d.title).slice(0,200)||'Untitled diagram',pages,activePage:active};
}

/* ============================== history & persistence ============================== */
function commit(){
  { const pg=page(), ids=new Set(ensureLayers(pg).map(l=>l.id)); for(const it of pg.items) if(!ids.has(it.layer)) it.layer=pg.activeLayer; }
  const H=S.history, snap=JSON.stringify(S.doc);
  if(H.stack[H.idx]===snap) return false;
  H.stack.length=H.idx+1; H.stack.push(snap);
  if(H.stack.length>HISTORY_MAX) H.stack.shift();
  H.idx=H.stack.length-1;
  scheduleSave(); invalidate({chrome:true});
  return true;
}
function restoreSnap(){
  S.doc=JSON.parse(S.history.stack[S.history.idx]);
  const ids=new Set(items().map(i=>i.id));
  S.sel=new Set([...S.sel].filter(id=>ids.has(id)));
  if(S.editing) finishEdit(true);
  V=viewFor(S.doc.activePage);
  scheduleSave(); invalidate();
}
function undo(){ if(S.history.idx>0){ S.history.idx--; restoreSnap(); } }
function redo(){ if(S.history.idx<S.history.stack.length-1){ S.history.idx++; restoreSnap(); } }

let saveTimer=null, pendingLegacy=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveLocal,400); }
function saveLocal(){
  const ok=store.set(KEY_DOC,JSON.stringify(S.doc))&&store.set(KEY_SCHEMA,String(SCHEMA));
  S.storageOk=ok;
  if(ok&&pendingLegacy){ store.del(pendingLegacy); pendingLegacy=null; }
  setStatus(ok?'All changes saved in this browser':'Browser storage is blocked here. Use File > Save as JSON to keep your work.',!ok);
  return ok;
}
function loadLocal(){
  let raw=store.get(KEY_DOC);
  if(raw==null){ for(const k of LEGACY_KEYS){ const v=store.get(k); if(v!=null){ raw=v; pendingLegacy=k; break; } } }
  if(raw==null) return null;
  try{ return migrate(raw); }catch(e){ console.warn('Stored diagram could not be loaded:',e); return null; }
}
function setStatus(msg,warn){ const s=$('#saveStatus'); if(!s) return; s.textContent=msg; s.classList.toggle('warn',!!warn); s.title=msg; }

/* ============================== text measurement ============================== */
let measureCtx=null;
try{ const c=document.createElement('canvas'); measureCtx=c.getContext?c.getContext('2d'):null; }catch(e){ measureCtx=null; }
const measureCache=new Map();
function textWidth(s,st){
  const fs=st.fontSize, key=(st.bold?'b':'')+(st.italic?'i':'')+fs+st.font+'|'+s;
  let w=measureCache.get(key);
  if(w!=null) return w;
  if(measureCtx){ measureCtx.font=(st.italic?'italic ':'')+(st.bold?'bold ':'')+fs+'px '+(FONTS[st.font]||FONTS.sans); w=measureCtx.measureText(s).width; }
  else w=s.length*fs*(st.font==='mono'?0.6:0.55);
  if(measureCache.size>6000) measureCache.clear();
  measureCache.set(key,w); return w;
}
function wrapText(text,maxW,st){
  const out=[], W=s=>textWidth(s,st);
  for(const para of String(text==null?'':text).split('\n')){
    let line='';
    for(const word of para.split(' ')){
      const test=line?line+' '+word:word;
      if(W(test)<=maxW){ line=test; continue; }
      if(line){ out.push(line); line=''; }
      if(W(word)<=maxW){ line=word; continue; }
      let chunk='';
      for(const ch of word){ if(chunk&&W(chunk+ch)>maxW){ out.push(chunk); chunk=ch; } else chunk+=ch; }
      line=chunk;
    }
    out.push(line);
  }
  return out;
}

/* ============================== connector routing ============================== */
function center(s){ return {x:s.x+s.w/2,y:s.y+s.h/2}; }
function portRel(s,side){
  const X=xf(s), us=(X.rot||X.flip)?unrotSide(X,side):side, G=geom(s.type,X.gw,X.gh,s.style);
  let p;
  if(G.ports&&G.ports[us]) p={x:G.ports[us][0],y:G.ports[us][1]};
  else { const ins=portInset(s.type,X.gw,X.gh)||{N:0,E:0,S:0,W:0};
    p=us==='N'?{x:X.gw/2,y:ins.N}:us==='E'?{x:X.gw-ins.E,y:X.gh/2}:us==='S'?{x:X.gw/2,y:X.gh-ins.S}:{x:ins.W,y:X.gh/2}; }
  return tp(X,p.x,p.y);
}
// pos (0..1) anchors a line anywhere along a side: left to right on N/S, top to bottom on E/W.
// Symbols keep their fixed terminals; other shapes follow their outline (box, ellipse or diamond).
function edgePoint(s,side,pos){
  const cx=s.x+s.w/2, cy=s.y+s.h/2;
  const k=u=>s.type==='ellipse'?Math.sqrt(Math.max(0,1-u*u)):s.type==='diamond'?Math.max(0,1-Math.abs(u)):1;
  if(side==='N'||side==='S'){ const x=s.x+s.w*pos, d=(s.h/2)*k((x-cx)/(s.w/2||1)); return {x,y:side==='N'?cy-d:cy+d}; }
  const y=s.y+s.h*pos, d=(s.w/2)*k((y-cy)/(s.h/2||1)); return {x:side==='W'?cx-d:cx+d,y};
}
function portPoint(s,side,pos){
  if(pos!=null&&!SYMBOL_INFO[s.type]&&Math.abs(pos-0.5)>1e-6) return edgePoint(s,side,pos);
  const p=portRel(s,side); return {x:s.x+p.x,y:s.y+p.y};
}
const endOf=t=>{ const o={id:t.id,side:t.side}; if(t.pos!=null) o.pos=t.pos; if(t.port) o.port=t.port; return o; };
function autoSide(s,ref){
  const c=center(s), dx=(ref.x-c.x)/(s.w/2||1), dy=(ref.y-c.y)/(s.h/2||1);
  if(Math.abs(dx)>=Math.abs(dy)) return dx>=0?'E':'W';
  return dy>=0?'S':'N';
}
function boundaryPoint(s,toward){
  const c=center(s), dx=toward.x-c.x, dy=toward.y-c.y;
  if(Math.abs(dx)<1e-9&&Math.abs(dy)<1e-9) return c;
  const a=Math.max(s.w/2,0.5), b=Math.max(s.h/2,0.5); let t;
  if(s.type==='ellipse') t=1/Math.sqrt((dx*dx)/(a*a)+(dy*dy)/(b*b));
  else if(s.type==='diamond') t=1/(Math.abs(dx)/a+Math.abs(dy)/b);
  else t=Math.min(Math.abs(dx)>1e-9?a/Math.abs(dx):Infinity,Math.abs(dy)>1e-9?b/Math.abs(dy):Infinity);
  return {x:c.x+dx*t,y:c.y+dy*t};
}
function inferDir(from,to){
  const dx=to.x-from.x, dy=to.y-from.y;
  if(Math.abs(dx)>=Math.abs(dy)) return {x:dx>=0?1:-1,y:0};
  return {x:0,y:dy>=0?1:-1};
}
function simplify(pts){
  const a=[];
  for(const p of pts){ const q=a[a.length-1]; if(!q||Math.abs(q.x-p.x)>0.01||Math.abs(q.y-p.y)>0.01) a.push({x:p.x,y:p.y}); }
  for(let i=a.length-2;i>=1;i--){
    const p=a[i-1], q=a[i], r=a[i+1];
    if((Math.abs(p.x-q.x)<0.01&&Math.abs(q.x-r.x)<0.01)||(Math.abs(p.y-q.y)<0.01&&Math.abs(q.y-r.y)<0.01)) a.splice(i,1);
  }
  return a;
}
// Middle bend on a grid line when snapping is on (and it still falls between the two ends).
function gridMid(u,v){ const m=(u+v)/2; if(!S.prefs||!S.prefs.snap) return m; const g=Math.round(m/GRID)*GRID; return (g>=Math.min(u,v)&&g<=Math.max(u,v))?g:m; }
function ortho(p1,d1,p2,d2,s1,s2){
  const a={x:p1.x+d1.x*s1,y:p1.y+d1.y*s1}, b={x:p2.x+d2.x*s2,y:p2.y+d2.y*s2};
  const h1=d1.x!==0, h2=d2.x!==0; let mid;
  if(h1&&h2){
    if(d1.x===-d2.x){
      if((b.x-a.x)*d1.x>=0){ const mx=gridMid(a.x,b.x); mid=[{x:mx,y:a.y},{x:mx,y:b.y}]; }
      else { const my=gridMid(a.y,b.y); mid=[{x:a.x,y:my},{x:b.x,y:my}]; }
    } else { const x=d1.x>0?Math.max(a.x,b.x):Math.min(a.x,b.x); mid=[{x,y:a.y},{x,y:b.y}]; }
  } else if(!h1&&!h2){
    if(d1.y===-d2.y){
      if((b.y-a.y)*d1.y>=0){ const my=gridMid(a.y,b.y); mid=[{x:a.x,y:my},{x:b.x,y:my}]; }
      else { const mx=gridMid(a.x,b.x); mid=[{x:mx,y:a.y},{x:mx,y:b.y}]; }
    } else { const y=d1.y>0?Math.max(a.y,b.y):Math.min(a.y,b.y); mid=[{x:a.x,y},{x:b.x,y}]; }
  } else if(h1){
    mid=((b.x-a.x)*d1.x>=0&&(b.y-a.y)*d2.y<=0)?[{x:b.x,y:a.y}]:[{x:a.x,y:b.y}];
  } else {
    mid=((b.y-a.y)*d1.y>=0&&(b.x-a.x)*d2.x<=0)?[{x:a.x,y:b.y}]:[{x:b.x,y:a.y}];
  }
  return simplify([p1,a,...mid,b,p2]);
}
function resolveEnd(end){
  if(end&&end.id){ const s=byId(end.id); if(isShape(s)){
    if(end.port&&devDef(s.type)){ const q=raPort(s,end.port); if(q) return {s,side:q.side,pq:q}; }
    return {s,side:end.side||'auto',pos:end.pos}; } }
  return {pt:{x:num(end&&end.x,0),y:num(end&&end.y,0)}};
}
// Returns {kind:'poly'|'curve', pts:[...]} in world coordinates.
function routeLine(L){
  const A=resolveEnd(L.from), B=resolveEnd(L.to), route=L.route||'orthogonal';
  const refA=A.pq?A.pq:A.s?(A.side!=='auto'?portPoint(A.s,A.side,A.pos):center(A.s)):A.pt;
  const refB=B.pq?B.pq:B.s?(B.side!=='auto'?portPoint(B.s,B.side,B.pos):center(B.s)):B.pt;
  let p1,d1=null,p2,d2=null;
  if(A.pq){ p1={x:A.pq.x,y:A.pq.y}; d1=SIDES[A.pq.side]; }
  else if(A.s){
    if(A.side==='auto'){ if(route==='straight') p1=boundaryPoint(A.s,refB); else { const sd=autoSide(A.s,refB); p1=portPoint(A.s,sd); d1=SIDES[sd]; } }
    else { p1=portPoint(A.s,A.side,A.pos); d1=SIDES[A.side]; }
  } else p1=A.pt;
  if(B.pq){ p2={x:B.pq.x,y:B.pq.y}; d2=SIDES[B.pq.side]; }
  else if(B.s){
    if(B.side==='auto'){ if(route==='straight') p2=boundaryPoint(B.s,refA); else { const sd=autoSide(B.s,refA); p2=portPoint(B.s,sd); d2=SIDES[sd]; } }
    else { p2=portPoint(B.s,B.side,B.pos); d2=SIDES[B.side]; }
  } else p2=B.pt;
  if(route==='straight') return {kind:'poly',pts:[p1,p2]};
  if(!d1) d1=inferDir(p1,p2);
  if(!d2) d2=inferDir(p2,p1);
  if(route==='curved'){
    const k=Math.max(30,dist(p1,p2)*0.4);
    return {kind:'curve',pts:[p1,{x:p1.x+d1.x*k,y:p1.y+d1.y*k},{x:p2.x+d2.x*k,y:p2.y+d2.y*k},p2]};
  }
  if(Array.isArray(L.waypoints)&&L.waypoints.length) return {kind:'poly',pts:manualRoute(p1,d1,p2,L.waypoints,A.s?d1:null,B.s?d2:null),manual:true};

}
// A re-routed elbow line keeps its middle bends; the first and last bends slide so the line stays
// square to its endpoints when shapes move.
function manualRoute(p1,d1,p2,wps,att1,att2){
  const w=wps.map(q=>({x:q.x,y:q.y})), n=w.length;
  if(n===1){
    const a={x:p2.x,y:p1.y}, b={x:p1.x,y:p2.y};
    w[0]=d1.x!==0?a:b;
  } else {
    if(Math.abs(w[0].x-w[1].x)<0.01) w[0].y=p1.y; else w[0].x=p1.x;
    if(Math.abs(w[n-2].x-w[n-1].x)<0.01) w[n-1].y=p2.y; else w[n-1].x=p2.x;
  }
  let P=simplify([p1,...w,p2]);
  // Leave and enter connection points square to their side: add a short stub if a bend would not.
  const vert=(a,b)=>Math.abs(a.x-b.x)<0.01;
  if(att2&&P.length>=2){ const q=P[P.length-2], hz=att2.x!==0, s2={x:p2.x+att2.x*STUB,y:p2.y+att2.y*STUB};
    if(hz?vert(q,p2):!vert(q,p2)){ const a=hz?{x:s2.x,y:q.y}:{x:q.x,y:s2.y}; P.splice(P.length-1,0,a,s2); } }
  if(att1&&P.length>=2){ const r=P[1], hz=att1.x!==0, s1={x:p1.x+att1.x*STUB,y:p1.y+att1.y*STUB};
    if(hz?vert(p1,r):!vert(p1,r)){ const b=hz?{x:s1.x,y:r.y}:{x:r.x,y:s1.y}; P.splice(1,0,s1,b); } }
  return simplify(P);
}
// Start a segment drag: returns a point list where the chosen segment is interior, inserting a short
// stub at an end when the user grabs the first or last segment.
function segDragBase(pts,i){
  const P=pts.map(q=>({x:q.x,y:q.y})); let k=i;
  const stub=(a,b)=>{ const L=dist(a,b)||1, m=Math.min(20,L/3); return {x:a.x+(b.x-a.x)/L*m,y:a.y+(b.y-a.y)/L*m}; };
  if(k===0){ const t=stub(P[0],P[1]); P.splice(1,0,{...t},{...t}); k=2; }
  if(k+1===P.length-1){ const t=stub(P[P.length-1],P[P.length-2]); P.splice(P.length-1,0,{...t},{...t}); }
  return {P,k,horiz:Math.abs(P[k].y-P[k+1].y)<0.5};

function shiftWaypoints(L,dx,dy){ if(L.waypoints) L.waypoints=L.waypoints.map(q=>({x:r2(q.x+dx),y:r2(q.y+dy)})); }
function pathD(kind,p,corner){
  const f=q=>r2(q.x)+' '+r2(q.y);
  if(kind==='curve') return 'M'+f(p[0])+'C'+f(p[1])+' '+f(p[2])+' '+f(p[3]);
  if(!corner||p.length<3) return 'M'+p.map(f).join('L');
  let d='M'+f(p[0]);
  for(let i=1;i<p.length-1;i++){
    const a=p[i-1], b=p[i], c=p[i+1], l1=dist(a,b), l2=dist(b,c), r=Math.min(corner,l1/2,l2/2);
    if(r<0.5){ d+='L'+f(b); continue; }
    d+='L'+f({x:b.x+(a.x-b.x)*r/l1,y:b.y+(a.y-b.y)*r/l1})+'Q'+f(b)+' '+f({x:b.x+(c.x-b.x)*r/l2,y:b.y+(c.y-b.y)*r/l2});
  }
  return d+'L'+f(p[p.length-1]);
}
// Nearest position (0..1, same parameter pointAt uses) on a routed line to point q.
function nearestT(R,q){
  let best=0, bd=Infinity;
  if(R.kind==='curve'){ for(let i=0;i<=60;i++){ const t=i/60, p=pointAt(R,t), d=dist(p,q); if(d<bd){ bd=d; best=t; } } return best; }
  const p=R.pts; let total=0; for(let i=1;i<p.length;i++) total+=dist(p[i-1],p[i]); if(!total) return 0.5;
  let acc=0;
  for(let i=1;i<p.length;i++){ const a=p[i-1], b=p[i], L=dist(a,b); if(!L) continue;
    const u=clamp(((q.x-a.x)*(b.x-a.x)+(q.y-a.y)*(b.y-a.y))/(L*L),0,1), x=a.x+(b.x-a.x)*u, y=a.y+(b.y-a.y)*u, d=Math.hypot(q.x-x,q.y-y);

function labelPoint(R,lab){ const p=pointAt(R,clamp(lab.t,0,1)); return {x:p.x+(lab.dx||0),y:p.y+(lab.dy||0)}; }
function pointAt(R,t){
  const p=R.pts;
  if(R.kind==='curve'){ const u=1-t; return {x:u*u*u*p[0].x+3*u*u*t*p[1].x+3*u*t*t*p[2].x+t*t*t*p[3].x,y:u*u*u*p[0].y+3*u*u*t*p[1].y+3*u*t*t*p[2].y+t*t*t*p[3].y}; }
  let total=0; for(let i=1;i<p.length;i++) total+=dist(p[i-1],p[i]);
  let goal=total*t;
  for(let i=1;i<p.length;i++){ const L=dist(p[i-1],p[i]); if(goal<=L||i===p.length-1){ const f=L?goal/L:0; return {x:p[i-1].x+(p[i].x-p[i-1].x)*f,y:p[i-1].y+(p[i].y-p[i-1].y)*f}; } goal-=L; }

/* ============================== pictures ==============================
   Image bytes live in IndexedDB (key: asset id), never in localStorage. Shapes refer to them by id.
   Save as JSON embeds the images so a file reopens complete in a fresh browser. */
const ASSETS=new Map(); // id -> {id,type,w,h,data(dataURL),url(blob URL for the editor)}
const IMG_TYPES=['image/png','image/jpeg','image/gif','image/webp','image/svg+xml','image/bmp'];
let idb=null;
function idbOpen(){ return new Promise(res=>{ try{ if(!window.indexedDB){ res(null); return; } const r=indexedDB.open('linework',1);
  r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('assets',{keyPath:'id'}); }catch(e){} }; r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); }
function idbReq(mode,fn){ return new Promise(res=>{ if(!idb){ res(null); return; } try{ const tx=idb.transaction('assets',mode), st=tx.objectStore('assets'), rq=fn(st);
  tx.oncomplete=()=>res(rq&&'result' in rq?rq.result:true); tx.onerror=()=>res(null); tx.onabort=()=>res(null); }catch(e){ res(null); } }); }
const idbPut=rec=>idbReq('readwrite',st=>st.put({id:rec.id,type:rec.type,w:rec.w,h:rec.h,data:rec.data}));
const idbAll=()=>idbReq('readonly',st=>st.getAll());
const idbDel=id=>idbReq('readwrite',st=>st.delete(id));
function dataUrlToBlob(data){
  const m=/^data:([^;,]+)(;base64)?,(.*)$/s.exec(data); if(!m) return null;
  try{ const raw=m[2]?atob(m[3]):decodeURIComponent(m[3]); const b=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) b[i]=raw.charCodeAt(i)&255; return new Blob([b],{type:m[1]}); }catch(e){ return null; }
}
function registerAsset(rec){

  const a={id:rec.id,type:rec.type,w:rec.w,h:rec.h,data:rec.data,url}; ASSETS.set(rec.id,a); return a;
}
function usedAssetIds(){ const u=new Set(); for(const p of S.doc.pages) for(const i of p.items) if(i.type==='image'&&i.img) u.add(i.img); return u; }
async function loadAssets(){

function readAsDataURL(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result)); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file); }); }
function imageSize(src){ return new Promise(res=>{ let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
  try{ const im=new Image(); im.onload=()=>fin({w:im.naturalWidth||300,h:im.naturalHeight||200}); im.onerror=()=>fin({w:300,h:200}); im.src=src; }catch(e){ fin({w:300,h:200}); }
  setTimeout(()=>fin({w:300,h:200}),2500); }); }
async function insertImageFile(file,at){

/* ============================== PDF export ==============================
   Each diagram page becomes one PDF page sized to its content (1 px = 0.75 pt), rendered at up to 3x
   resolution. Lossless (Flate) when the browser has CompressionStream, otherwise high-quality JPEG. */
function rasterizeSvg(svgStr){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const wpx=img.width||1, hpx=img.height||1, sc=Math.max(1,Math.min(3,4000/Math.max(wpx,hpx)));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(wpx*sc)); c.height=Math.max(1,Math.round(hpx*sc));
      const ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      res({canvas:c,wPt:wpx*0.75,hPt:hpx*0.75}); }catch(e){ rej(e); } };
    img.onerror=()=>rej(new Error('This browser could not draw the diagram.'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
  });
}
async function encodeCanvas(c){
  if(window.CompressionStream){
    try{
      const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data, rgb=new Uint8Array(c.width*c.height*3);
      for(let i=0,j=0;i<d.length;i+=4){ rgb[j++]=d[i]; rgb[j++]=d[i+1]; rgb[j++]=d[i+2]; }
      const out=await new Response(new Blob([rgb]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
      return {width:c.width,height:c.height,filter:'FlateDecode',data:new Uint8Array(out)};
    }catch(e){}
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
  return {width:c.width,height:c.height,filter:'DCTDecode',data:new Uint8Array(await blob.arrayBuffer())};
}
// pages: [{width,height,filter,data:Uint8Array,wPt,hPt}] -> Uint8Array of a PDF 1.4 file
function buildPdf(pages,title){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=b=>{ if(typeof b==='string') b=enc.encode(b); parts.push(b); len+=b.length; };
  const obj=(n,body)=>{ offs[n]=len; push(n+' 0 obj\n'+body+'\nendobj\n'); };
  const sobj=(n,dict,bytes)=>{ offs[n]=len; push(n+' 0 obj\n'+dict+'\nstream\n'); push(bytes); push('\nendstream\nendobj\n'); };
  const esc=t=>String(t).replace(/[\\()]/g,m=>'\\'+m).replace(/[^\x20-\x7e]/g,'');
  push('%PDF-1.4\n'); push(new Uint8Array([37,226,227,207,211,10]));
  const N=pages.length, total=4+3*N; // objects 0..3+3N: catalog, pages, info, then page/content/image per page
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+pages.map((p,i)=>(4+3*i)+' 0 R').join(' ')+'] /Count '+N+' >>');
  obj(3,'<< /Title ('+esc(title||'Diagram')+') /Producer (Linework Diagrams) >>');
  pages.forEach((p,i)=>{
    const pg=4+3*i, cn=5+3*i, im=6+3*i, W=r2(p.wPt), H=r2(p.hPt), content='q '+W+' 0 0 '+H+' 0 0 cm /Im'+i+' Do Q';
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im'+i+' '+im+' 0 R >> >> /Contents '+cn+' 0 R >>');
    sobj(cn,'<< /Length '+content.length+' >>',enc.encode(content));
    sobj(im,'<< /Type /XObject /Subtype /Image /Width '+p.width+' /Height '+p.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /'+p.filter+' /Length '+p.data.length+' >>',p.data);
  });
  const xref=len; let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++) x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+total+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  const out=new Uint8Array(len); let o=0; for(const b of parts){ out.set(b,o); o+=b.length; } return out;
}
function pageSvgs(all){
  const list=all?S.doc.pages:[page()], prev=S.doc.activePage, out=[];
  try{ for(const pg of list){ if(!renderList(pg).length) continue; S.doc.activePage=pg.id; out.push(exportSVGString()); } }
  finally{ S.doc.activePage=prev; }

let pdfBusy=false;
async function exportPdf(all){
  if(pdfBusy) return; const svgs=pageSvgs(all);
  if(!svgs.length){ toast('There is nothing on '+(all?'any page':'this page')+' to export.'); return; }
  pdfBusy=true; toast('Building PDF...');
  try{
    const pages=[];
    for(const s of svgs){ const r=await rasterizeSvg(s); const e=await encodeCanvas(r.canvas); pages.push(Object.assign(e,{wPt:r.wPt,hPt:r.hPt})); }
    const bytes=buildPdf(pages,S.doc.title);
    download(fileBase()+'.pdf',new Blob([bytes],{type:'application/pdf'}),'application/pdf','PDF exported ('+pages.length+' page'+(pages.length>1?'s':'')+')');
  }catch(e){ console.warn(e); toast('PDF export failed: '+(e&&e.message?e.message:'unknown error')); }
  finally{ pdfBusy=false; }
}

function download(name,data,mime,okMsg){

function runCmd(name){
  if(!name) return;
  if(name.startsWith('soon:')){ toast(name.slice(5)+' is coming soon.'); return; }
  if(name.startsWith('layer:')){ const p=name.split(':'); layerCmd(p[1],p[2]); return; }
  const f=CMDS[name]; if(f) f();
}

/* ============================== chrome ============================== */
function applyTheme(){ document.documentElement.setAttribute('data-theme',S.prefs.theme==='dark'?'dark':'light'); }
function updateChrome(){
  const H=S.history;
  document.querySelectorAll('[data-cmd="undo"]').forEach(b=>{ if(b.classList.contains('btn')) b.disabled=H.idx<=0; });
  document.querySelectorAll('[data-cmd="redo"]').forEach(b=>{ if(b.classList.contains('btn')) b.disabled=H.idx>=H.stack.length-1; });
  const zt=Math.round(V.z*100)+'%'; $('#zoomBtn').textContent=zt; $('#zoomLabel').textContent=zt;
  const press=(cmd,on)=>document.querySelectorAll('#toolbar [data-cmd="'+cmd+'"]').forEach(b=>b.setAttribute('aria-pressed',String(!!on)));
  press('modePan',S.prefs.dragMode==='pan'); press('modeSelect',S.prefs.dragMode==='select'); stage.classList.toggle('mode-pan',S.prefs.dragMode==='pan');
  press('toggleGrid',S.prefs.grid); press('toggleSnap',S.prefs.snap); press('toggleLeft',S.prefs.left); press('toggleRight',S.prefs.right);
  press('routeStraight',S.prefs.route==='straight'); press('routeOrthogonal',S.prefs.route==='orthogonal'); press('routeCurved',S.prefs.route==='curved');
  const t=$('#docTitle'); if(document.activeElement!==t) t.value=S.doc.title;
  const app=$('#app'); app.classList.toggle('no-left',!S.prefs.left); app.classList.toggle('no-right',!S.prefs.right);
  const n=S.sel.size; $('#selInfo').textContent=n?n+' selected':'';
  const sel=n>0; document.querySelectorAll('#toolbar [data-cmd="front"],#toolbar [data-cmd="back"],#toolbar [data-cmd="delete"]').forEach(b=>{b.disabled=!sel;});
  document.querySelectorAll('#toolbar [data-cmd="group"]').forEach(b=>{b.disabled=n<2;});
}
function wireChrome(){
  document.querySelectorAll('[data-icon]').forEach(b=>b.insertBefore(icon(b.getAttribute('data-icon')),b.firstChild));
  document.addEventListener('click',e=>{
    const c=e.target.closest&&e.target.closest('[data-cmd]');
    if(c&&!c.disabled&&!c.closest('#props [data-set]')){ closeMenus(); hideCtx(); runCmd(c.getAttribute('data-cmd')); }
  });
  const menus=$('.menus');
  menus.addEventListener('click',e=>{ const b=e.target.closest('[data-menu]'); if(!b) return; if(openMenu&&openMenu.btn===b) closeMenus(); else openMenuFor(b); });

  document.addEventListener('pointerdown',e=>{
    if(openMenu&&!openMenu.el.contains(e.target)&&!e.target.closest('[data-menu]')) closeMenus();
    if(ctxEl&&!ctxEl.contains(e.target)) hideCtx();
    if(S.quick&&!S.quick.el.contains(e.target)&&!stage.contains(e.target)) closeQuick();

  $('#fileInput').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) openJsonFile(f); });

  svg.addEventListener('wheel',onWheel,{passive:false});

    const it=e.target.closest&&e.target.closest('[data-id]');

}
function wireKeys(){

}
