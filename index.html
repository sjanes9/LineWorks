<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Linework Diagrams</title>
<style>
/* ================= DESIGN TOKENS (single source of truth) ================= */
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel-2:#f6f7f9; --hover:#eef2f8;
  --border:#dde1e7; --border-strong:#c3c9d3;
  --text:#1f2430; --text-2:#576070; --text-3:#6b7280;
  --accent:#2f6fed; --accent-2:#e7effe; --accent-text:#ffffff;
  --soon-bg:#fff1d6; --soon-text:#8a5a00;
  --danger:#d93838;
  --canvas:#ffffff; --pasteboard:#e8ebf0; --grid-minor:#f0f2f5; --grid-major:#e2e6ec;
  --sel:#2f6fed; --guide:#e5487c; --port:#2f6fed; --target:#19a974;
  --shadow:0 6px 24px rgba(20,25,40,.14);
  --menu-h:44px; --toolbar-h:40px; --pagebar-h:34px; --left-w:232px; --right-w:268px;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  --fs-xs:12px; --fs-sm:12.5px; --fs-md:13px; --fs-lg:15px;
  --z-menu:50; --z-pop:60; --z-ghost:70; --z-modal:80; --z-toast:90;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#15181d; --panel:#1d2128; --panel-2:#232831; --hover:#2a303b;
  --border:#2f3541; --border-strong:#434b59;
  --text:#e6e9ef; --text-2:#aab2c0; --text-3:#9aa3b2;
  --accent:#5b8ff9; --accent-2:#22324f; --accent-text:#ffffff;
  --soon-bg:#3b2f17; --soon-text:#f3c66b;
  --canvas:#1b1f26; --pasteboard:#2b313b; --grid-minor:rgba(255,255,255,.045); --grid-major:rgba(255,255,255,.09);
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
/* ========================================================================= */

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:var(--fs-md)/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{display:block;flex:none}
[hidden]{display:none!important}

#app{--lw:var(--left-w);--rw:var(--right-w);display:grid;height:100vh;height:100dvh;
  grid-template-rows:var(--menu-h) var(--toolbar-h) minmax(0,1fr) var(--pagebar-h);
  grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);
  grid-template-areas:"menu menu menu" "tool tool tool" "left stage right" "pages pages pages"}
#app.no-left{--lw:0px} #app.no-right{--rw:0px}
#app.no-left #left,#app.no-right #right{display:none}

/* ---------- menubar ---------- */
#menubar{grid-area:menu;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-lg);white-space:nowrap}
.doc-meta{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.doc-title{border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:1px 4px;font-size:var(--fs-md);font-weight:600;max-width:340px;width:100%}
.doc-title:hover{border-color:var(--border)} .doc-title:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.menus{display:flex;gap:2px}
.mb{border:0;background:transparent;padding:1px 7px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text-2)}
.mb:hover,.mb.open{background:var(--hover);color:var(--text)}
.mb-right{display:flex;align-items:center;gap:6px}
.save-status{font-size:var(--fs-xs);color:var(--text-3);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.save-status.warn{color:var(--danger)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border);background:var(--panel);border-radius:var(--r-md);font-size:var(--fs-sm);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn[disabled]{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent);color:var(--accent)}
.soon{display:inline-block;font-size:10px;line-height:1;padding:3px 5px;border-radius:999px;background:var(--soon-bg);color:var(--soon-text);font-weight:600;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.btn.primary .soon{background:rgba(255,255,255,.22);color:#fff}

/* ---------- toolbar ---------- */
#toolbar{grid-area:tool;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 6px;flex:none}
.tb-label{font-size:var(--fs-xs);color:var(--text-3);margin:0 2px 0 4px;white-space:nowrap}
.tb-spacer{flex:1}
.zoom-btn{min-width:54px;justify-content:center;font-variant-numeric:tabular-nums}

/* ---------- left library ---------- */
#left{grid-area:left;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.lib-search{padding:8px;border-bottom:1px solid var(--border)}
.lib-search input{width:100%;height:30px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel-2);padding:0 8px}
.lib-search input:focus{outline:none;border-color:var(--accent)}
.lib-view{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--fs-xs);color:var(--text-2)}
.lib-view select{flex:1;min-width:0;height:26px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);font-size:var(--fs-xs);color:var(--text)}
.lib-name{display:none}
.lib-grid.mode-labeled{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mode-labeled .lib-tile{aspect-ratio:auto;flex-direction:column;gap:3px;padding:6px 4px;height:auto}
.mode-labeled .lib-tile svg{width:100%;height:46px;flex:none}
.mode-labeled .lib-name{display:block;font-size:var(--fs-xs);line-height:1.25;color:var(--text);text-align:center;overflow-wrap:anywhere}
.mode-labeled .lib-cap{display:none}
.lib-grid.mode-names{grid-template-columns:1fr;gap:0;padding:0 6px 6px}
.mode-names .lib-tile{aspect-ratio:auto;justify-content:flex-start;padding:6px 8px;height:auto;text-align:left;border-radius:var(--r-sm)}
.mode-names .lib-tile svg,.mode-names .lib-cap{display:none}
.mode-names .lib-name{display:block;font-size:var(--fs-sm);line-height:1.3;color:var(--text)}
.mode-names .lib-name small{color:var(--text-3);font-size:var(--fs-xs);margin-left:6px}
#libList{overflow-y:auto;flex:1;padding-bottom:16px;-webkit-overflow-scrolling:touch}
.lib-cat-h{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:8px 10px 6px;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);text-align:left}
.lib-cat-h .ic{transition:transform .15s}
.lib-cat:not(.collapsed) .lib-cat-h .ic{transform:rotate(90deg)}
.lib-cat.collapsed .lib-grid{display:none}
.lib-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:0 8px 6px}
.lib-tile{aspect-ratio:1/1;border:1px solid transparent;border-radius:var(--r-md);background:transparent;display:flex;align-items:center;justify-content:center;padding:4px;touch-action:pan-y;color:var(--text-2)}
.lib-tile:hover{background:var(--hover);border-color:var(--border)}
.lib-tile svg{width:100%;height:100%;pointer-events:none;overflow:visible}
.lib-tile.dev{flex-direction:column;gap:1px;padding:3px 1px}
.lib-tile.dev svg{width:100%;height:calc(100% - 11px);flex:none}
.lib-cap{font-size:8.5px;letter-spacing:-.1px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);pointer-events:none}
.lib-soon{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;border:0;background:transparent;padding:7px 10px;font-size:var(--fs-sm);color:var(--text-3);text-align:left}
.lib-soon:hover{background:var(--hover)}
.lib-soon-h{padding:12px 10px 4px;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);border-top:1px solid var(--border);margin-top:6px}
.lib-empty{padding:12px;color:var(--text-3);font-size:var(--fs-sm)}

/* ---------- stage ---------- */
#stage{grid-area:stage;position:relative;overflow:hidden;background:var(--canvas);touch-action:none;user-select:none;-webkit-user-select:none}
#svg{display:block;width:100%;height:100%;outline:none}
#stage.panning #svg,#stage.mode-pan #svg{cursor:grab} #stage.dragging #svg{cursor:grabbing}
.item.shape .body{pointer-events:all}
.item.shape{cursor:move}
.item.line .hit{pointer-events:stroke;cursor:pointer}
.item text{pointer-events:none}
.ov-sel{fill:none;stroke:var(--sel);pointer-events:none}
.ov-sel-line{fill:none;stroke:var(--sel);opacity:.28;pointer-events:none;stroke-linecap:round;stroke-linejoin:round}
.ov-group{fill:none;stroke:var(--sel);pointer-events:none}
.ov-handle{fill:#fff;stroke:var(--sel)}
.ov-rot{cursor:pointer}
.ov-rot circle{fill:#fff;stroke:var(--sel)}
.ov-rot path{stroke:var(--sel);stroke-linecap:round;stroke-linejoin:round}
.ov-rot:hover circle{fill:var(--sel)} .ov-rot:hover path{stroke:#fff}
.ov-rot-stem{stroke:var(--sel)}
.ov-handle[data-handle="nw"],.ov-handle[data-handle="se"]{cursor:nwse-resize}
.ov-handle[data-handle="ne"],.ov-handle[data-handle="sw"]{cursor:nesw-resize}
.ov-handle[data-handle="n"],.ov-handle[data-handle="s"]{cursor:ns-resize}
.ov-handle[data-handle="e"],.ov-handle[data-handle="w"]{cursor:ew-resize}
.ov-end{stroke:var(--sel);cursor:crosshair}
.ov-seg{fill:#fff;stroke:var(--sel)}
.ov-add{cursor:pointer} .ov-add circle{fill:var(--sel)} .ov-add path{stroke:#fff;stroke-linecap:round} .ov-add:hover circle{filter:brightness(1.15)} .ov-seg.hz{cursor:ns-resize} .ov-seg.vt{cursor:ew-resize}
.menu.ctx{max-height:calc(100vh - 16px);overflow-y:auto}
.ov-end.free{fill:#fff} .ov-end.attached{fill:var(--sel)}
.ov-port{cursor:crosshair}
.ov-port .vis{fill:var(--port);stroke:#fff;opacity:.85}
.ov-port:hover .vis{opacity:1}
.ov-port .pad{fill:transparent}
.ov-target{fill:rgba(25,169,116,.06);stroke:var(--target);pointer-events:none}
.ov-dot{fill:#fff;stroke:var(--target);pointer-events:none}
.ov-dot.on{fill:var(--target)}
.ov-portlab{fill:var(--text);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none;font-family:system-ui,sans-serif}
.has-sheet{background:var(--pasteboard)!important}
.sheet{filter:drop-shadow(0 1px 3px rgba(15,23,42,.18))}
.on-locked{pointer-events:none}
.layer-list{display:grid;gap:4px}
.layer-row{display:grid;grid-template-columns:22px minmax(0,1fr) 28px;gap:3px 4px;align-items:center;padding:3px;border-radius:var(--r-sm);border:1px solid transparent}
.layer-row.on{background:var(--accent-2);border-color:var(--accent)}
.layer-row input[type=text]{min-width:0;height:26px;padding:0 6px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);font-size:var(--fs-sm)}
.lay-btns{grid-column:2/-1;display:flex;gap:3px;justify-content:flex-end}
.lay-n{font-size:var(--fs-xs);color:var(--text-3);text-align:center}
.lay-act{width:22px;height:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.lay-act .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--text-3)}
.layer-row.on .lay-act .dot{background:var(--accent);border-color:var(--accent)}
.btn.icon.sm{width:26px;height:26px;padding:0;justify-content:center}
.btn.icon.sm[aria-pressed="true"]{background:var(--hover);color:var(--accent)}
.dev-ports{display:grid;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:4px 6px}
.dev-port{display:grid;grid-template-columns:44px 1fr;gap:6px;font-size:12px;line-height:1.35}
.dev-port b{font-weight:600}
.dev-port.used span{color:var(--accent)}
.ov-temp{fill:none;stroke:var(--sel);pointer-events:none;stroke-dasharray:6 4}
.ov-marquee{fill:rgba(47,111,237,.08);stroke:var(--sel);pointer-events:none}
.ov-guide{stroke:var(--guide);pointer-events:none}
.empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty-hint div{max-width:360px;text-align:center;color:#8a93a3;font-size:var(--fs-md);line-height:1.6;padding:20px;border:1.5px dashed #d3d8e0;border-radius:var(--r-lg);background:rgba(255,255,255,.7)}
.empty-hint b{color:#4c5566}
.text-editor{position:absolute;z-index:5;border:1.5px solid var(--accent);background:rgba(255,255,255,.92);border-radius:2px;resize:none;outline:none;padding:0 2px;margin:0;overflow:hidden;line-height:1.25;box-shadow:0 0 0 3px rgba(47,111,237,.15);user-select:text;-webkit-user-select:text}

/* ---------- right props ---------- */
#right{grid-area:right;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.props-title{padding:12px 12px 4px;font-weight:600;font-size:var(--fs-lg)}
.props-sub{padding:0 12px 6px;color:var(--text-3);font-size:var(--fs-xs)}
.sec{border-top:1px solid var(--border);padding:10px 12px}
.sec:first-of-type{border-top:0}
.sec-h{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;margin-bottom:4px}
.row-l{color:var(--text-2);font-size:var(--fs-sm);flex:none;width:72px}
.row-c{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end;min-width:0}
.row input[type=text],.row input[type=number],.row select{height:28px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 6px;width:100%;min-width:0}
.row input[type=number]{width:72px;flex:none}
.row input:focus,.row select:focus{outline:none;border-color:var(--accent)}
.row input[type=color]{width:34px;height:28px;padding:2px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);flex:none}
.row input[type=range]{width:100%;accent-color:var(--accent)}
.row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);color:var(--text-2);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--panel-2);height:28px;min-width:30px;padding:0 6px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border);font-size:var(--fs-sm)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent-2);color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:2px 0 8px}
.sw{aspect-ratio:1/1;border-radius:4px;border:1px solid var(--border-strong);padding:0}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px}
.geo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.geo label{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--text-2)}
.geo input{height:28px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 6px;width:100%;min-width:0}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-grid .btn{justify-content:center}
.icon-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.muted{color:var(--text-3)} .small{font-size:var(--fs-sm);margin:0}
.soon-list{display:flex;flex-direction:column;gap:6px}
.soon-row{display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-sm);color:var(--text-3)}

/* ---------- pagebar ---------- */
#pagebar{grid-area:pages;display:flex;align-items:stretch;background:var(--panel);border-top:1px solid var(--border);padding:0 6px;gap:2px}
#pageTabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none}
.ptab{display:flex;align-items:center;gap:4px;padding:0 10px;font-size:var(--fs-sm);color:var(--text-2);border-top:2px solid transparent;cursor:pointer;white-space:nowrap;user-select:none}
.ptab:hover{background:var(--hover)}
.ptab.on{color:var(--text);border-top-color:var(--accent);background:var(--panel-2);font-weight:600}
.ptab-x{border:0;background:transparent;padding:2px;border-radius:3px;display:flex;color:var(--text-3)}
.ptab-x:hover{background:var(--border);color:var(--text)}
.ptab input{height:22px;width:120px;border:1px solid var(--accent);border-radius:3px;padding:0 4px;background:var(--panel)}
.pb-add{align-self:center}
.pb-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--text-3);padding-right:6px}

/* ---------- menus, popups ---------- */
.menu{position:fixed;z-index:var(--z-menu);min-width:230px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);padding:4px}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:var(--r-sm);text-align:left;font-size:var(--fs-sm)}
.menu-item:hover{background:var(--hover)}
.pop-list{display:grid;gap:1px;max-height:300px;overflow:auto;min-width:220px}
.pop-li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:transparent;padding:6px 8px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text);text-align:left}
.pop-li small{color:var(--text-3);font-size:var(--fs-xs)}
.pop-li:hover{background:var(--hover)}
.pop-li.on{background:var(--accent-2);color:var(--accent)}
.menu-item.is-soon{color:var(--text-3)}
.mi-check{width:14px;flex:none;color:var(--accent)}
.mi-label{flex:1}
.mi-key{color:var(--text-3);font-size:var(--fs-xs)}
.menu-sep{height:1px;background:var(--border);margin:4px 2px}
.quick{position:absolute;z-index:var(--z-pop);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);padding:8px;width:212px}
.quick-h{font-size:var(--fs-xs);font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.quick-skip{margin-top:6px;width:100%;border:1px solid var(--border);background:var(--panel-2);border-radius:var(--r-sm);padding:5px;font-size:var(--fs-sm)}
.ghost-drag{position:fixed;left:0;top:0;z-index:var(--z-ghost);pointer-events:none;opacity:.75;color:#3d4757}
.ghost-drag svg{overflow:visible;display:block;transform:translate(-50%,-50%)}
.ghost-drag.over{opacity:.95}

/* ---------- floating editing bar ---------- */
.ftb{position:absolute;z-index:var(--z-pop);display:flex;flex-direction:column;align-items:flex-start}
.ftb.up{flex-direction:column-reverse}
.ftb-bar{display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.ftb-btn{width:38px;height:36px;border:0;background:transparent;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0}
.ftb-btn:hover,.ftb-btn[aria-expanded="true"]{background:var(--hover)}
.ftb-btn[aria-pressed="true"]{color:var(--accent)}
.ftb-btn[disabled]{opacity:.35;cursor:default}
.ftb-aa{font-weight:600;font-size:15px}
.ftb-sep{width:1px;height:24px;background:var(--border);margin:0 3px}
.ftb-pop{margin-top:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:12px;width:316px;max-height:500px;overflow-y:auto}
.ftb.up .ftb-pop{margin:0 0 6px}
.pop-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pop-row select{height:30px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);padding:0 6px;flex:1;min-width:0}
.pop-title{font-weight:600;font-size:var(--fs-lg);margin-right:auto;margin-bottom:6px;display:block}

/* ---------- rotation (90 degree steps) and flip ----------
   Stored x,y,w,h are the displayed box. Geometry is built unrotated (gw x gh) and mapped through tp(). */
function xf(it){
  const rot=it.rot||0, flip=!!it.flip, swap=rot===90||rot===270;
  const X={rot,flip,gw:swap?it.h:it.w,gh:swap?it.w:it.h,m:null};
  if(rot||flip){ const o=tp(X,0,0), a=tp(X,1,0), c=tp(X,0,1); X.m=[a.x-o.x,a.y-o.y,c.x-o.x,c.y-o.y,o.x,o.y].map(r2); }
  return X;
}
function tp(X,u,v){
  if(X.flip) u=X.gw-u;
  switch(X.rot){ case 90: return {x:X.gh-v,y:u}; case 180: return {x:X.gw-u,y:X.gh-v}; case 270: return {x:v,y:X.gw-u}; default: return {x:u,y:v}; }
}
function unrotSide(X,side){
  const o=tp(X,0,0), t=SIDES[side];
  for(const us of SIDE_KEYS){ const p=tp(X,SIDES[us].x,SIDES[us].y); if(Math.round(p.x-o.x)===t.x&&Math.round(p.y-o.y)===t.y) return us; }
  return side;
}
// How far each port sits inside the bounding box, so connectors meet the outline.
function portInset(type,w,h){
  switch(type){
    case 'triangle': return {N:0,S:0,E:w*.25,W:w*.25};
    case 'parallelogram': return {N:0,S:0,E:w*.09,W:w*.09};
    case 'trapezoid': return {N:0,S:0,E:w*.075,W:w*.075};
    case 'document': return {N:0,S:h*.15,E:0,W:0};
    case 'callout': return {N:0,S:h*.25,E:0,W:0};
    case 'manualInput': return {N:h*.125,S:0,E:0,W:0};
    case 'star': return {N:0,S:h*.2,E:w*.2,W:w*.2};
    case 'arrow': return {N:h*.25,S:h*.25,E:0,W:0};
    case 'cloud': return {N:h*.03,S:h*.03,E:w*.04,W:w*.04};
    case 'pentagon': return {N:0,S:0,E:w*.04,W:w*.04};
    default: return null;
  }
}

const isContainer=s=>isShape(s)&&CONTAINER_TYPES.has(s.type);
function insideBox(a,c){ return a!==c&&a.x>=c.x-0.5&&a.y>=c.y-0.5&&a.x+a.w<=c.x+c.w+0.5&&a.y+a.h<=c.y+c.h+0.5&&a.w*a.h<c.w*c.h; }
// Items that ride along when containers move: shapes inside a moving container, and free lines whose ends are both inside.
function carriedBy(list){
  const moving=new Set(list.map(i=>i.id)), out=[];
  let conts=list.filter(isContainer); if(!conts.length) return out;
  for(let pass=0;pass<4&&conts.length;pass++){
    const next=[];
    for(const it of items()){
      if(moving.has(it.id)||it.locked) continue;
      if(isShape(it)&&conts.some(c=>insideBox(it,c))){ out.push(it); moving.add(it.id); if(isContainer(it)) next.push(it); }
      else if(isLine(it)&&!it.from.id&&!it.to.id){ const pin=p=>conts.some(c=>p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h); if(pin(it.from)&&pin(it.to)){ out.push(it); moving.add(it.id); } }
    }
    conts=next;
  }
  return out;
}

function buildSwimlanes(def,x,y){

  if(t.dir==='h'){ const W=720, LH=140, TH=34, x0=x-W/2, y0=y-(TH+LH*n)/2;
    mk('rect',x0,y0,W,TH,'Pool',Object.assign({},DEF_SHAPE_STYLE,{fill:'#e2e8f0',stroke:'#64748b',bold:true,fontSize:14}));

// Adds a lane after the last lane of the selected lane's group and widens or lengthens the pool title.
function addLane(){
  const s=selItems().find(i=>i.type==='lane_h'||i.type==='lane_v'); if(!s){ toast('Select a lane first.'); return; }
  const grp=s.groupId?items().filter(i=>i.groupId===s.groupId):[s], lanes=grp.filter(i=>i.type===s.type);
  const hz=s.type==='lane_h', last=lanes.reduce((a,b)=>hz?(b.y>a.y?b:a):(b.x>a.x?b:a));
  const n=JSON.parse(JSON.stringify(last)); n.id=uid(); n.text='Lane '+(lanes.length+1);
  if(hz) n.y=r2(last.y+last.h); else n.x=r2(last.x+last.w);
  const title=grp.find(i=>i.type==='rect');
  if(title&&!hz&&Math.abs(title.x+title.w-(last.x+last.w))<1) title.w=r2(title.w+last.w);
  const idx=items().indexOf(last); items().splice(idx+1,0,n);
  setSel(s.groupId?grp.map(i=>i.id).concat(n.id):[n.id]); commit(); invalidate(); toast('Lane added');
}

function commit(){

  if(H.stack.length>HISTORY_MAX) H.stack.shift();
  H.idx=H.stack.length-1;
  scheduleSave(); invalidate({chrome:true}); autoVersion();
  return true;
}
function restoreSnap(){

function undo(){ if(S.history.idx>0){ S.history.idx--; restoreSnap(); } }

function saveLocal(){
  const ok=store.set(KEY_DOC,JSON.stringify(S.doc))&&store.set(KEY_SCHEMA,String(SCHEMA));
  S.storageOk=ok;
  if(ok&&pendingLegacy){ store.del(pendingLegacy); pendingLegacy=null; }
  setStatus(fileStatus()?fileStatus()+(ok?'':'. Browser storage is blocked.'):ok?'All changes saved in this browser':'Browser storage is blocked here. Use File > Save to keep your work.',!ok);
  return ok;
}
function loadLocal(){

  if(raw==null){ for(const k of LEGACY_KEYS){ const v=store.get(k); if(v!=null){ raw=v; pendingLegacy=k; break; } } }

  let w=measureCache.get(key);
  if(w!=null) return w;
  if(measureCtx){ measureCtx.font=(st.italic?'italic ':'')+(st.bold?'bold ':'')+fs+'px '+(FONTS[st.font]||FONTS.sans); w=measureCtx.measureText(s).width; }

      const test=line?line+' '+word:word;

  const refA=A.pq?A.pq:A.s?(A.side!=='auto'?portPoint(A.s,A.side,A.pos):center(A.s)):A.pt;

  else if(A.s){
    if(A.side==='auto'){ if(route==='straight') p1=boundaryPoint(A.s,refB); else { const sd=autoSide(A.s,refB); p1=portPoint(A.s,sd); d1=sideDir(A.s,sd); } }
    else { p1=portPoint(A.s,A.side,A.pos); d1=sideDir(A.s,A.side); }

  if(B.pq){ p2={x:B.pq.x,y:B.pq.y}; d2=SIDES[B.pq.side]; }
  else if(B.s){
    if(B.side==='auto'){ if(route==='straight') p2=boundaryPoint(B.s,refA); else { const sd=autoSide(B.s,refA); p2=portPoint(B.s,sd); d2=sideDir(B.s,sd); } }
    else { p2=portPoint(B.s,B.side,B.pos); d2=sideDir(B.s,B.side); }

// A re-routed elbow line keeps its middle bends; the first and last bends slide so the line stays

/* ---------- signal line types (ISA-5.1) and network cable styles ----------
   A line's `signal` draws markers along it. Conventions marked verified were confirmed from published
   ISA-5.1 summaries; the others are drawn from general practice and not checked against the standard. */
const SIG_BASIS_V='ISA-5.1 instrument line symbol (convention confirmed from published ISA-5.1 summaries; exact proportions not verified).';
const SIG_BASIS_U='ISA-5.1 lists this line type, but its drawing here is general practice and was NOT verified against the standard.';

  electric:{n:'Electric signal',m:null,dash:'dashed',verified:true},
  pneumatic:{n:'Pneumatic signal',m:'slash2',verified:true},
  hydraulic:{n:'Hydraulic signal',m:'L',verified:true},
  capillary:{n:'Capillary tube',m:'x',verified:true},
  data:{n:'Software or data link',m:'circle',verified:true},
  mechanical:{n:'Mechanical link',m:'dot',verified:false},
  emGuided:{n:'Electromagnetic or sonic signal (guided)',m:'sine',verified:false},

function useTemplate(id,mode){
  const t=TEMPLATES.find(x=>x.id===id); if(!t) return null; const d=tplDoc(t); closeModal();
  if(mode==='pages'){ for(const p of d.pages){ let nm=p.name, k=2; while(S.doc.pages.some(q=>q.name===nm)) nm=p.name+' '+(k++); p.name=nm; S.doc.pages.push(p); }
    for(const k of ['datasets','rules']) if(d[k]) S.doc[k]=(S.doc[k]||[]).concat(d[k]);
    commit(); switchPage(d.pages[0].id); fitView(); toast('Added "'+t.name+'" as '+d.pages.length+' new page'+(d.pages.length>1?'s':'')+'.'); return d; }
  fileReset(); loadDocument(d,'"'+t.name+'" template opened. Ctrl+Z brings back your previous diagram.'); return d;

/* ============================== phone layout ============================== */
const PHONE_Q='(max-width: 700px)';
function isPhone(){ try{ return !!(window.matchMedia&&window.matchMedia(PHONE_Q).matches); }catch(e){ return false; } }
function isCoarse(){ try{ return !!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches); }catch(e){ return false; } }
// Overlay sizes in screen pixels; bigger on touch screens so handles can be grabbed with a finger.
function uiK(){ return isCoarse()?1.7:1; }
// On a phone the library and properties open as sheets over the canvas; only one at a time.
function phoneSheets(which){ if(!isPhone()) return; if(which==='left'&&S.prefs.left) S.prefs.right=false; if(which==='right'&&S.prefs.right) S.prefs.left=false; }
let lpTimer=null, lpAt=null;
function longPressStart(e){
  if(e.pointerType!=='touch'||touches.size>1||S.pen) return; clearTimeout(lpTimer); lpAt={x:e.clientX,y:e.clientY,t:e.target};
  lpTimer=setTimeout(()=>{ if(!lpAt||touches.size>1) return; const at=lpAt; lpAt=null; S.op=null;
    const it=at.t&&at.t.closest&&at.t.closest('[data-id]'); if(it){ const id=it.getAttribute('data-id'); if(!S.sel.has(id)) setSel(expandGroups([id])); }
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(x){} showCtx(at.x,at.y); },550);
}
function longPressMove(e){ if(lpAt&&Math.hypot(e.clientX-lpAt.x,e.clientY-lpAt.y)>9){ clearTimeout(lpTimer); lpAt=null; } }
function longPressEnd(){ clearTimeout(lpTimer); lpAt=null; }
/* ============================== collapsible branches with animation ==============================
   A mind map topic or org chart box with children shows a small arrow button. Clicking it folds its
   branch away (children slide back into it and fade) or unfolds it (children slide out and fade in),
   the tree closes up or opens out, and the view glides to keep the branch on screen. it.collapsed is
   saved with the diagram. Animation is a short tween of real positions, so lines follow the shapes. */
const FOLD_MS=340;
function reduceMotion(){ try{ return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ return false; } }
function hasKids(s){ return !!s&&!!s.family&&familyKids(s).length>0; }
// Ids hidden because an ancestor is folded.
function foldedIds(pg){
  pg=pg||page(); const its=pg.items; if(!its.some(i=>i.collapsed)) return null;
  const prev=S.doc.activePage; let out=new Set();
  try{ S.doc.activePage=pg.id; for(const s of its) if(s.collapsed&&s.family) for(const k of familyKids(s)) subtreeIds(k,out); } finally{ S.doc.activePage=prev; }
  return out.size?out:null;
}
// Items folded away but still drawn because they are animating.
function foldVisible(it,hid){ return !hid||!hid.has(it.id)||(TW&&TW.items.has(it.id)); }
function lineFolded(L,hid){ return !!hid&&((L.from.id&&hid.has(L.from.id)&&!(TW&&TW.items.has(L.from.id)))||(L.to.id&&hid.has(L.to.id)&&!(TW&&TW.items.has(L.to.id)))); }
let TW=null; // {items:Map(id->{x0,y0,x1,y1,o0,o1}), t0, dur, view:{tx0,ty0,z0,tx1,ty1,z1}|null, done, present}

// Parent -> child is a line from the parent to the child between shapes of the same family.
function familyKids(p){ const out=[]; for(const L of items()) if(isLine(L)&&L.from.id===p.id&&L.to.id&&L.to.id!==p.id){ const c=byId(L.to.id); if(c&&c.family===p.family&&!out.includes(c)) out.push(c); } return out; }
function familyParent(c){ for(const L of items()) if(isLine(L)&&L.to.id===c.id&&L.from.id&&L.from.id!==c.id){ const p=byId(L.from.id); if(p&&p.family===c.family) return p; } return null; }
function subtreeIds(c,acc){ acc=acc||new Set(); if(acc.has(c.id)) return acc; acc.add(c.id); familyKids(c).forEach(k=>subtreeIds(k,acc)); return acc; }
function shiftTree(c,dx,dy){ if(!dx&&!dy) return; const ids=subtreeIds(c); for(const id of ids){ const s=byId(id); s.x=r2(s.x+dx); s.y=r2(s.y+dy); }
  for(const L of items()) if(isLine(L)&&L.waypoints&&ids.has(L.from.id)&&ids.has(L.to.id)) shiftWaypoints(L,dx,dy); }
const FAM_GAP={mindmap:{level:70,sib:16},org:{level:60,sib:24}};
function blockSize(c,seen){ seen=seen||new Set(); const mm=c.family==='mindmap', own=mm?c.h:c.w; if(seen.has(c.id)) return own; seen.add(c.id);
  const ks=familyKids(c); if(!ks.length||c.collapsed) return own; const g=FAM_GAP[c.family].sib;
  return Math.max(own,ks.reduce((a,k)=>a+blockSize(k,seen),0)+g*(ks.length-1)); }
function layoutKids(p){
  const ks=familyKids(p); if(!ks.length) return; const G=FAM_GAP[p.family], mm=p.family==='mindmap';
  ks.sort((a,b)=>mm?a.y-b.y:a.x-b.x);
  const sizes=ks.map(k=>blockSize(k)), total=sizes.reduce((a,b)=>a+b,0)+G.sib*(ks.length-1);
  let pos=mm?p.y+p.h/2-total/2:p.x+p.w/2-total/2;
  ks.forEach((k,i)=>{ if(k.locked){ pos+=sizes[i]+G.sib; return; }
    if(mm) shiftTree(k,p.x+p.w+G.level-k.x,pos+sizes[i]/2-k.h/2-k.y); else shiftTree(k,pos+sizes[i]/2-k.w/2-k.x,p.y+p.h+G.level-k.y);
    pos+=sizes[i]+G.sib; });
}
function familyRoot(c){ let r=c, guard=0, p; while((p=familyParent(r))&&guard++<50) r=p; return r; }
function layoutTree(r,seen){ seen=seen||new Set(); if(seen.has(r.id)) return; seen.add(r.id); familyKids(r).forEach(k=>layoutTree(k,seen)); layoutKids(r); }
// Tab adds a child; Enter adds a sibling. The new box opens for typing with its placeholder selected.
function addFamilyChild(s,asSibling,opts){
  opts=opts||{};
  if(!s||!s.family){ toast('Select a mind map topic or org chart box first.'); return null; }
  const parent=asSibling?familyParent(s):s;
  if(!parent){ toast(s.family==='mindmap'?'The central topic has no siblings. Press Tab to add a topic.':'The top box has no siblings. Press Tab to add a report.'); return null; }
  if(parent.locked){ toast('Locked. Unlock to edit.'); return null; }
  if(parent.collapsed){ if(TW) tweenEnd(); delete parent.collapsed; }
  const fam=parent.family, level=(parent.level||0)+1, kids=familyKids(parent);
  let key;
  if(fam==='mindmap') key=level<=1?'mm_main':'mm_sub';
  else key=parent.type==='org_role'?'org_role':'org_card';
  const c=makeShape(key,0,0); c.family=fam; c.level=level;
  c.text=fam==='mindmap'?(level<=1?'Main topic':'Subtopic'):(key==='org_role'?'Role\nName':'Name\nTitle');
  if(fam==='org'&&parent.type===c.type) c.style.stroke=parent.style.stroke;
  if(fam==='mindmap'){ c.x=parent.x+parent.w+70; c.y=asSibling?s.y+0.5:(kids.length?Math.max(...kids.map(k=>k.y))+1:parent.y); }
  else { c.y=parent.y+parent.h+60; c.x=asSibling?s.x+0.5:(kids.length?Math.max(...kids.map(k=>k.x))+1:parent.x); }
  items().push(c);
  const stroke=fam==='mindmap'?(parent.style.stroke&&parent.style.stroke!=='none'?parent.style.stroke:'#3a7bec'):'#6b7280';
  items().push(fam==='mindmap'
    ?makeLine({id:parent.id,side:'E'},{id:c.id,side:'W'},{route:'curved',endArrow:'none',style:Object.assign({},DEF_LINE_STYLE,{stroke,sw:2})})
    :makeLine({id:parent.id,side:'S'},{id:c.id,side:'N'},{route:'orthogonal',endArrow:'none',style:Object.assign({},DEF_LINE_STYLE,{stroke})}));
  layoutTree(familyRoot(parent));
  if(!opts.noCommit){ setSel([c.id]); commit(); invalidate(); }
  if(!opts.noEdit) startEdit(c.id,null,null,-1);
  return c;
}

const STYLE_SHARED=['stroke','sw','dash','opacity','fontSize','fontColor','font','bold','italic','underline'];
function copyStyle(){ const f=selItems()[0]; if(!f){ toast('Select something to copy its style.'); return; }
  S.styleClip={kind:f.kind,style:JSON.parse(JSON.stringify(f.style)),route:f.route,startArrow:f.startArrow,endArrow:f.endArrow}; toast('Style copied'); }
function pasteStyle(){
  const c=S.styleClip; if(!c){ toast('Copy a style first (Ctrl+Alt+C).'); return; }
  const sel=unlockedSel(); if(!sel.length) return;
  for(const it of sel){
    if(it.kind===c.kind){ Object.assign(it.style,JSON.parse(JSON.stringify(c.style))); if(isLine(it)){ it.route=c.route; it.startArrow=c.startArrow; it.endArrow=c.endArrow; } }
    else STYLE_SHARED.forEach(k=>{ if(k in c.style) it.style[k]=c.style[k]; });
  }
  commit(); invalidate(); toast('Style pasted');
}
function selectWhere(fn,label){ const ids=pickList().filter(fn).map(i=>i.id); setSel(ids); toast(ids.length+' '+label+' selected'); }
function selectSameFill(){ const f=selItems().find(isShape); if(!f){ toast('Select a shape first.'); return; } selectWhere(i=>isShape(i)&&i.style.fill===f.style.fill,'shapes with that fill'); }
function duplicatePage(id){
  const src=S.doc.pages.find(p=>p.id===(id||S.doc.activePage)); if(!src) return;
  const map=new Map(), gmap=new Map(), its=JSON.parse(JSON.stringify(src.items));
  its.forEach(i=>map.set(i.id,uid()));
  its.forEach(i=>{ i.id=map.get(i.id); if(i.groupId){ if(!gmap.has(i.groupId)) gmap.set(i.groupId,uid()); i.groupId=gmap.get(i.groupId); }
    if(isLine(i)) for(const k of ['from','to']) if(i[k].id) i[k].id=map.get(i[k].id); });
  const p=Object.assign({id:uid(),name:(src.name+' copy').slice(0,80),items:its},JSON.parse(JSON.stringify({size:src.size,bg:src.bg,layers:ensureLayers(src),activeLayer:src.activeLayer})));
  S.doc.pages.splice(S.doc.pages.indexOf(src)+1,0,p); S.doc.activePage=p.id; S.sel.clear();
  S.views[p.id]=Object.assign({},viewFor(src.id)); V=viewFor(p.id); commit(); invalidate(); toast('Page duplicated');
}

/* ============================== pictures ==============================
   Image bytes live in IndexedDB (key: asset id), never in localStorage. Shapes refer to them by id.
   Save as JSON embeds the images so a file reopens complete in a fresh browser. */
const ASSETS=new Map(); // id -> {id,type,w,h,data(dataURL),url(blob URL for the editor)}
const IMG_TYPES=['image/png','image/jpeg','image/gif','image/webp','image/svg+xml','image/bmp'];
let idb=null;
function idbOpen(){ return new Promise(res=>{ try{ if(!window.indexedDB){ res(null); return; } const r=indexedDB.open('linework',1);
  r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('assets',{keyPath:'id'}); }catch(e){} }; r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); }
function idbReq(mode,fn){ return new Promise(res=>{ if(!idb){ res(null); return; } try{ const tx=idb.transaction('assets',mode), st=tx.objectStore('assets'), rq=fn(st);
  tx.oncomplete=()=>res(rq&&'result' in rq?rq.result:true); tx.onerror=()=>res(null); tx.onabort=()=>res(null); }catch(e){ res(null); } }); }
const idbPut=rec=>idbReq('readwrite',st=>st.put({id:rec.id,type:rec.type,w:rec.w,h:rec.h,data:rec.data}));
const idbAll=()=>idbReq('readonly',st=>st.getAll());
const idbDel=id=>idbReq('readwrite',st=>st.delete(id));
function dataUrlToBlob(data){
  const m=/^data:([^;,]+)(;base64)?,(.*)$/s.exec(data); if(!m) return null;
  try{ const raw=m[2]?atob(m[3]):decodeURIComponent(m[3]); const b=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) b[i]=raw.charCodeAt(i)&255; return new Blob([b],{type:m[1]}); }catch(e){ return null; }
}
function registerAsset(rec){
  let url=rec.data;
  try{ if(URL.createObjectURL){ const b=dataUrlToBlob(rec.data); if(b) url=URL.createObjectURL(b); } }catch(e){}
  const a={id:rec.id,type:rec.type,w:rec.w,h:rec.h,data:rec.data,url}; ASSETS.set(rec.id,a); return a;
}
function usedAssetIds(){ const u=new Set(); for(const p of S.doc.pages) for(const i of p.items) if(i.type==='image'&&i.img) u.add(i.img); if(S.doc.devPics) for(const k in S.doc.devPics) u.add(S.doc.devPics[k]); return u; }
async function loadAssets(){
  idb=await idbOpen();
  const recs=(await idbAll())||[], used=usedAssetIds(); for(const v of Object.values(picLib())) used.add(v);
  for(const r of recs){ if(!r||!r.id) continue; if(used.has(r.id)||S.history.stack.some(h=>h.includes(r.id))) registerAsset(r); else idbDel(r.id); }
  if(recs.length) invalidate({content:true});
}
function readAsDataURL(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result)); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file); }); }
function imageSize(src){ return new Promise(res=>{ let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
  try{ const im=new Image(); im.onload=()=>fin({w:im.naturalWidth||300,h:im.naturalHeight||200}); im.onerror=()=>fin({w:300,h:200}); im.src=src; }catch(e){ fin({w:300,h:200}); }
  setTimeout(()=>fin({w:300,h:200}),2500); }); }
async function insertImageFile(file,at){
  if(!file) return null;
  if(!IMG_TYPES.includes(file.type)){ toast('That file is not a supported picture (PNG, JPEG, GIF, WebP, SVG or BMP).'); return null; }
  if(file.size>15*1024*1024){ toast('That picture is over 15 MB. Please make it smaller first.'); return null; }
  try{ const data=await readAsDataURL(file); return await insertImageData(data,file.type,at,null,file.name); }
  catch(e){ toast('Could not read that picture.'); return null; }
}
async function insertImageData(data,type,at,size,name){
  const sz=size||await imageSize(data);
  const rec={id:uid(),type,w:sz.w,h:sz.h,data}; registerAsset(rec);
  const stored=await idbPut(rec);
  const target=S.replaceImageId?byId(S.replaceImageId):null; S.replaceImageId=null;
  if(target&&target.type==='image'){ target.img=rec.id; const k=target.w/Math.max(1,sz.w); target.h=r2(Math.max(10,sz.h*k)); commit(); invalidate(); toast('Picture replaced'); return target; }
  const k=Math.min(1,400/Math.max(sz.w,sz.h,1)), w=Math.max(20,Math.round(sz.w*k)), h=Math.max(20,Math.round(sz.h*k)), c=at||viewCenterWorld();
  const s={id:uid(),kind:'shape',type:'image',x:r2(c.x-w/2),y:r2(c.y-h/2),w,h,text:'',style:Object.assign({},DEF_SHAPE_STYLE,{fill:'none',stroke:'none',fontSize:12,valign:'top'}),layer:activeLayerId(),img:rec.id};
  if(S.prefs.snap){ s.x=Math.round(s.x/GRID)*GRID; s.y=Math.round(s.y/GRID)*GRID; }
  items().push(s); setSel([s.id]); commit(); invalidate();
  toast(stored?'Picture added':'Picture added. This browser cannot keep pictures between visits, so use File > Save to keep it.');
  return s;
}
function importAssets(assets){
  if(!assets||typeof assets!=='object') return 0; let n=0;
  for(const id in assets){ const a=assets[id]; if(!a||typeof a.data!=='string'||!/^data:image\/(png|jpeg|gif|webp|svg\+xml|bmp)[;,]/.test(a.data)) continue;
    const rec={id:String(id).slice(0,64),type:String(a.type||'image/png'),w:num(a.w,300),h:num(a.h,200),data:a.data}; registerAsset(rec); idbPut(rec); n++; }
  return n;
}
function exportAssets(){ const out={}; for(const id of usedAssetIds()){ const a=ASSETS.get(id); if(a) out[id]={type:a.type,w:a.w,h:a.h,data:a.data}; } return out; }
function docForSave(){ const assets=exportAssets(); return Object.keys(assets).length?Object.assign({},S.doc,{assets}):S.doc; }
function pickImage(replaceId){ S.replaceImageId=replaceId||null; const f=$('#imgInput'); f.value=''; f.click(); }
function imageAspect(){ const s=selItems().find(i=>i.type==='image'), a=s&&ASSETS.get(s.img); if(!a||s.locked) return; s.h=r2(s.w*a.h/Math.max(1,a.w)); commit(); invalidate(); }
function wireImages(){
  $('#imgInput').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) insertImageFile(f); });
  stage.addEventListener('dragover',e=>{ if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; } });
  stage.addEventListener('drop',e=>{
    const fl=e.dataTransfer&&e.dataTransfer.files; if(!fl||!fl.length) return; e.preventDefault();
    const w=toWorld(e); let off=0;
    const tgt=shapeAt(w,0); if(fl.length===1&&tgt&&RA_DEV[tgt.type]&&IMG_TYPES.includes(fl[0].type)){ setDevPic(tgt.type,fl[0],S.prefs.picRemember!==false); return; }
    for(const f of fl){ if(/\.(json|vsdx|vsd|lucid)$/i.test(f.name)||f.type==='application/json'){ openAnyFile(f,null); return; } insertImageFile(f,{x:w.x+off,y:w.y+off}); off+=24; }
  });
  document.addEventListener('paste',e=>{
    const t=e.target, tag=t&&t.tagName; if(tag==='INPUT'||tag==='TEXTAREA'||(t&&t.isContentEditable)) return;
    const its=e.clipboardData&&e.clipboardData.items; if(!its) return;
    for(const it of its){ if(it.kind==='file'&&IMG_TYPES.includes(it.type)){ const f=it.getAsFile(); if(f){ e.preventDefault(); insertImageFile(f); return; } } }
  });
}

/* ============================== PDF export ==============================
   Each diagram page becomes one PDF page sized to its content (1 px = 0.75 pt), rendered at up to 3x
   resolution. Lossless (Flate) when the browser has CompressionStream, otherwise high-quality JPEG. */
function rasterizeSvg(svgStr){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const wpx=img.width||1, hpx=img.height||1, sc=Math.max(1,Math.min(3,4000/Math.max(wpx,hpx)));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(wpx*sc)); c.height=Math.max(1,Math.round(hpx*sc));
      const ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      res({canvas:c,wPt:wpx*0.75,hPt:hpx*0.75}); }catch(e){ rej(e); } };
    img.onerror=()=>rej(new Error('This browser could not draw the diagram.'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
  });
}
async function encodeCanvas(c){
  if(window.CompressionStream){
    try{
      const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data, rgb=new Uint8Array(c.width*c.height*3);
      for(let i=0,j=0;i<d.length;i+=4){ rgb[j++]=d[i]; rgb[j++]=d[i+1]; rgb[j++]=d[i+2]; }
      const out=await new Response(new Blob([rgb]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
      return {width:c.width,height:c.height,filter:'FlateDecode',data:new Uint8Array(out)};
    }catch(e){}
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
  return {width:c.width,height:c.height,filter:'DCTDecode',data:new Uint8Array(await blob.arrayBuffer())};
}
// pages: [{width,height,filter,data:Uint8Array,wPt,hPt}] -> Uint8Array of a PDF 1.4 file
function buildPdf(pages,title){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=b=>{ if(typeof b==='string') b=enc.encode(b); parts.push(b); len+=b.length; };
  const obj=(n,body)=>{ offs[n]=len; push(n+' 0 obj\n'+body+'\nendobj\n'); };
  const sobj=(n,dict,bytes)=>{ offs[n]=len; push(n+' 0 obj\n'+dict+'\nstream\n'); push(bytes); push('\nendstream\nendobj\n'); };
  const esc=t=>String(t).replace(/[\\()]/g,m=>'\\'+m).replace(/[^\x20-\x7e]/g,'');
  push('%PDF-1.4\n'); push(new Uint8Array([37,226,227,207,211,10]));
  const N=pages.length, total=4+3*N; // objects 0..3+3N: catalog, pages, info, then page/content/image per page
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+pages.map((p,i)=>(4+3*i)+' 0 R').join(' ')+'] /Count '+N+' >>');
  obj(3,'<< /Title ('+esc(title||'Diagram')+') /Producer (Linework Diagrams) >>');
  pages.forEach((p,i)=>{
    const pg=4+3*i, cn=5+3*i, im=6+3*i, W=r2(p.wPt), H=r2(p.hPt), content='q '+W+' 0 0 '+H+' 0 0 cm /Im'+i+' Do Q';
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im'+i+' '+im+' 0 R >> >> /Contents '+cn+' 0 R >>');
    sobj(cn,'<< /Length '+content.length+' >>',enc.encode(content));
    sobj(im,'<< /Type /XObject /Subtype /Image /Width '+p.width+' /Height '+p.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /'+p.filter+' /Length '+p.data.length+' >>',p.data);
  });
  const xref=len; let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++) x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+total+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  const out=new Uint8Array(len); let o=0; for(const b of parts){ out.set(b,o); o+=b.length; } return out;
}
function pageSvgs(all){
  const list=all?S.doc.pages:[page()], prev=S.doc.activePage, out=[];
  try{ for(const pg of list){ if(!renderList(pg).length) continue; S.doc.activePage=pg.id; out.push(exportSVGString()); } }
  finally{ S.doc.activePage=prev; }
  return out;
}
let pdfBusy=false;
async function exportPdf(all){
  if(pdfBusy) return; const svgs=pageSvgs(all);
  if(!svgs.length){ toast('There is nothing on '+(all?'any page':'this page')+' to export.'); return; }
  pdfBusy=true; toast('Building PDF...');
  try{
    const pages=[];
    for(const s of svgs){ const r=await rasterizeSvg(s); const e=await encodeCanvas(r.canvas); pages.push(Object.assign(e,{wPt:r.wPt,hPt:r.hPt})); }
    const bytes=buildPdf(pages,S.doc.title);
    download(fileBase()+'.pdf',new Blob([bytes],{type:'application/pdf'}),'application/pdf','PDF exported ('+pages.length+' page'+(pages.length>1?'s':'')+')');
  }catch(e){ console.warn(e); toast('PDF export failed: '+(e&&e.message?e.message:'unknown error')); }
  finally{ pdfBusy=false; }
}

function fileBase(){ return (S.doc.title||'diagram').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'diagram'; }
function exportSVGString(opts){ return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(exportSVGNode(opts)); }
// When hosted as a claude.ai artifact, page-started downloads are blocked; the host's
// `downloads` capability shows the viewer a save prompt instead. Anywhere else, use <a download>.
let hostDownloads=null;
function initHostDownloads(){
  try{
    const c=window.claude;
    if(c&&typeof c.use==='function') Promise.resolve(c.use('downloads')).then(ns=>{ hostDownloads=ns||null; }).catch(()=>{});
  }catch(e){}
}
function download(name,data,mime,okMsg){
  if(hostDownloads){
    hostDownloads.save({filename:name,data}).then(()=>{ if(okMsg) toast(okMsg); }).catch(err=>{
      const code=err&&err.code;
      if(code==='declined') toast('Save cancelled.');
      else if(code==='rate_limited') toast('A save prompt is already open.');
      else if(typeof data==='string') showTextModal(name,data);
      else toast('Saving files is not available here. Try Export SVG.');
    });
    return true;
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
    const url=URL.createObjectURL(blob), a=el('a',{href:url,download:name});
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){
    console.warn('Download failed:',e);
    if(typeof data==='string') showTextModal(name,data); else toast('Download was blocked by this browser.');
    return false;
  }
}
function exportPng(){
  const s=exportSVGString(), img=new Image(), scale=2;
  img.onload=()=>{
    try{
      const c=document.createElement('canvas'); c.width=img.width*scale; c.height=img.height*scale;
      const ctx=c.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
      c.toBlob(b=>{ if(b){ download(fileBase()+'.png',b,'image/png','PNG exported'); } else toast('PNG export failed. Try Export SVG.'); },'image/png');
    }catch(e){ toast('PNG export failed. Try Export SVG.'); }
  };
  img.onerror=()=>toast('PNG export failed in this browser. Try Export SVG.');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
function loadDocument(d,msg){

function openJsonFile(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{ const raw=JSON.parse(String(fr.result)); const d=migrate(raw); const n=importAssets(raw&&raw.assets); loadDocument(d,'Opened "'+d.title+'"'+(n?' with '+n+' picture'+(n>1?'s':''):'')); }catch(e){ toast('Could not open file: '+(e&&e.message?e.message:'invalid JSON')); } };
  fr.onerror=()=>toast('Could not read that file.');
  fr.readAsText(file);
}

    el('h3',{text:'Anchoring lines'}),el('p',{text:'Drop a line end on a blue midpoint, anywhere along a shape edge (it snaps to the grid, and several lines can share a side), or on the shape body for a floating connection that picks the best side. Electrical and P&ID symbols keep their fixed terminals.'}),
    el('h3',{text:'Network and signal lines'}),el('p',{text:'The Network library has office and industrial devices (router, switch, firewall, server, workstation, access point, PLC chassis, HMI, DIN-rail switch, remote I/O, drive and more) plus cable styles. Device tags sit under the icon, and several cables can land on one side of a device. The P&ID signal lines library has the ISA-5.1 instrument line types. Drag a line tile onto the canvas to place a line, or select existing lines and click a tile to restyle them. Any line can also change type from Type in the right panel or the line color menu.'}),
    el('p',{text:'Process connection, electric, pneumatic, hydraulic, capillary and data-link line conventions match published ISA-5.1 summaries. Mechanical link and the two electromagnetic or sonic types are listed by the standard but their drawings here are not verified, and are marked so.'}),
    el('h3',{text:'Library view'}),el('p',{text:'Use Show under Search shapes to pick how libraries look: Auto (pictures for shapes, a names list for the Rockwell device libraries), Pictures, Pictures and names (two larger tiles per row with the name under each), or Names only. Your choice is remembered in this browser.'}),
    el('h3',{text:'Containers and swimlanes'}),el('p',{text:'Containers, group frames, lanes, rooms and the cloud region, network and subnet frames carry whatever sits fully inside them: drag or nudge the container and its contents move too, including containers nested inside it. Drag a shape out to separate it. Containers always draw behind other shapes, larger ones behind smaller ones. Swimlane tiles insert a pool title and lanes as one group; select a lane and click Add lane in the right panel to add another.'}),
    el('h3',{text:'Entity relationship'}),el('p',{text:'The entity table shows a table name and its columns: double-click it, keep the name on the first line and put one column per line. Lines starting with PK, FK or UK fill the key column, and primary keys are underlined. The table grows with its rows. Chen notation shapes (entity, weak entity, relationship, attributes) and crow\'s foot relationship lines are in the same library.'}),
    el('h3',{text:'Cloud and building architecture'}),el('p',{text:'Cloud architecture has vendor-neutral icons for clients, networking, compute, storage, databases, integration, security and management, plus region, availability zone, virtual network, subnet and security group frames. Vendor icon sets (AWS, Azure, Google Cloud) are not included. Building architecture has floor plan walls, doors, windows, stairs, fixtures and furniture, a dimension line and a few electrical plan symbols; the electrical plan symbols follow common practice and are marked unverified.'}),
    el('h3',{text:'Rockwell PLCs, switches and network devices'}),el('p',{text:'Six libraries hold Rockwell controllers, Stratix switches, comm modules and adapters, drives and motion, HMIs, and gateways and safety I/O, with one tile per catalog number. They start collapsed; type a catalog number such as L33ER or BMS10 in Search shapes to find one quickly. Each device has its own connection point for every communication port (Ethernet, SFP, combo, PoE, USB, serial, DSI and DisplayPort). Hover a device to see its port dots, then drag from a dot to draw a cable, or drop a line end on a port. The port name appears while you aim. Cables from copper ports start blue, fiber and SFP ports orange, and serial or USB ports dotted.'}),
    el('p',{text:'Select a device to see its port list, which ports are connected, and the source the port set was checked against. Devices marked Unverified came from a secondary source or an ambiguous one. Port placement on the shape is schematic: one row along the bottom, or odd positions on top and even on the bottom for large switches. Drives, Kinetix and PanelView Plus 7 Standard tiles cover a whole family; type the full catalog number into the shape.'}),
    el('h3',{text:'Robots and robot controllers (Yaskawa and FANUC)'}),
    el('p',{text:'The Yaskawa Motoman robots, FANUC robots and their legacy libraries hold one tile per robot model. Each robot is a card with a line drawing of its kind of arm (articulated, collaborative, palletizing, SCARA, delta or dual-arm), the model name, a spec line with payload, horizontal reach and number of axes, and one ROB pin at the bottom for the controller cable. Draw a line from ROB to the ROB pin of a controller; robot cable lines are thick and brown.'}),
    el('p',{text:'Every robot also carries data fields: Manufacturer, Model, Series, Type, Payload (kg), Reach (mm), Axes, Controller and Spec status. Use them in text with {{Payload (kg)}}, in conditional formatting, or export them with the other data to CSV. Change model in the floating toolbar swaps a robot for another model of the same series and updates these fields; fields you added yourself stay.'}),
    el('p',{text:'Values come from the source shown in the right panel. A star after a value on the shape means it came from a secondary or third-party source and is marked Unverified. A question mark, and Not found in the panel, means the value was not in the sources checked; it is never filled in from the model name. Many Yaskawa models show ? ax because the Yaskawa catalog used does not list the number of axes.'}),
    el('p',{text:'Yaskawa robot controllers, FANUC robot controllers and Yaskawa drives and motion work like the Rockwell devices: one pin per port. Controllers have pendant (TP or PP), robot cable (ROB), Ethernet, and where known USB, serial and fieldbus option pins. Drives have the communication option slot, serial and safety pins where the source confirms them, plus generic power and motor pins. Legacy controllers whose ports were not found show only the pendant and robot pins and are marked Unverified. The R-30iB Plus Ethernet port speed is left open because the sources disagree.'}),
    el('h3',{text:'Mind maps and org charts'}),el('p',{text:'Drag a Central topic or an org chart box onto the canvas. With it selected, press Tab (or click the blue + button) to add a child and Enter to add a sibling; the new box opens for typing. Tab while typing adds the next level. Children are spaced automatically, and Tidy layout in the right-click menu re-spaces a whole tree. Typing on library placeholder text such as Central topic replaces it.'}),
    el('h3',{text:'Resizing groups'}),el('p',{text:'Select several items (or a group) and drag any of the eight handles on the dashed box to resize them together. Positions and sizes scale with the box; text size stays the same. Hold Shift on a corner to keep proportions.'}),
    el('h3',{text:'Re-routing lines'}),el('p',{text:'Select an elbow line to show a small handle on each segment. Drag a handle to move that segment; the bends stay where you put them when shapes move. Right-click the line and choose Reset line path to go back to automatic routing. Changing the line shape or reconnecting an end also resets it.'}),
    el('h3',{text:'Pictures'}),el('p',{text:'Use Insert > Picture, the Picture toolbar button or Upload picture in the library, or drag a picture file onto the canvas, or paste one. PNG, JPEG, GIF, WebP, SVG and BMP up to 15 MB. Corner handles keep the proportions (hold Shift to stretch). Pictures are stored in this browser and are included when you Save as JSON, so the file reopens complete anywhere.'}),
    el('h3',{text:'PDF'}),el('p',{text:'File > Export PDF makes a PDF of this page, or all pages with one PDF page each, sized to the drawing. Pages are high-resolution images of the diagram, so the text in the PDF is not selectable.'}),
    el('h3',{text:'Page size and background'}),el('p',{text:'Click empty canvas to see Page settings in the right panel. Size is Infinite canvas (the default) or a sheet: Letter, Legal, Tabloid, ANSI C, D and E, or A4 to A0. The sheet is drawn at 96 pixels per inch on a gray pasteboard, and Orientation switches Portrait and Landscape. Background sets the sheet color (or the canvas color on an infinite canvas); tick Default to go back to white. SVG, PNG and PDF exports of a sized page are cut to the sheet, so anything outside it is left out.'}),
    el('h3',{text:'Layers'}),el('p',{text:'Each page has its own layers, listed under Layers when nothing is selected. The top row draws on top. Click the dot at the left of a layer to make it active: new shapes and lines go on the active layer. Use the eye to hide a layer (hidden layers are left out of exports too), the lock to stop its items being selected or moved, the arrows to change the stacking order, and the trash can to delete a layer with everything on it (Ctrl+Z brings it back). Rename a layer by typing in its name. To move items to another layer, select them and pick the layer under Layer in the right panel. Within a layer, Bring to front and Send to back still work as usual.'}),
    el('h3',{text:'Shadow, tags, notes and alt text'}),el('p',{text:'Select an item and scroll the right panel. Effects > Drop shadow adds a soft shadow to shapes (it exports too). Tags and notes takes comma separated tags and a note; an item with a note shows a small yellow note badge, and hovering it shows the note. Alt text describes an item for screen readers; it is written into the canvas and into exported SVG as a title.'}),
    el('h3',{text:'Actions'}),el('p',{text:'Action > On click makes an item do something: open a web link, go to a page, go to the next or previous page, or show, hide or toggle a layer on the current page. An item with an action shows a purple lightning badge; click the badge to run it while editing. In Present mode, clicking the item itself runs it.'}),
    el('h3',{text:'Data linking and conditional formatting'}),el('p',{text:'Every shape can carry data fields: select it and use Data > Add field, then type a name and a value. To bring in a table, use Import CSV data (also under File). The first row is the column names and the first column is the key. Link a shape to a row with Data set and the key list under it; the shape then has every column as a field. Type {{Field name}} in a shape\'s text, or pick one from Show in text, to display a value. Importing a file with the same name again refreshes the rows and keeps the links. Data sets are saved in the diagram.'}),
    el('p',{text:'With nothing selected, Data and rules lists the data sets and the conditional formatting rules. A rule names a field, a test (equals, contains, greater than, is empty and so on) and a value, and recolors the fill, the border or both of every shape that passes. Numbers are compared as numbers, so 460.0 equals 460. Rules do not change a shape\'s own colors; remove the rule and the shape looks as before.'}),
    el('h3',{text:'Present'}),el('p',{text:'Present (top right, View > Present or F5) shows the diagram full screen, one page at a time, with nothing editable. Use the arrow keys, Page Up and Page Down, or the Previous and Next buttons; Esc exits. Shapes with a link or an action are clickable. Layers shown or hidden by actions go back to how they were when you exit.'}),
    el('h3',{text:'Find and replace'}),el('p',{text:'Ctrl+F (or Edit > Find and replace) opens the find bar. It searches shape text, text on lines, tags and notes, on this page or all pages, ignoring upper and lower case. Next and Prev select each match and bring it into view. Replace and Replace all change shape and line text only, skip locked items, and undo in one step.'}),
    el('h3',{text:'Version history'}),el('p',{text:'File > Version history saves named copies of the whole diagram in this browser and lists them with Restore and Delete. Linework also keeps an automatic copy about every 10 minutes while you edit. Restoring keeps the state you were in as an automatic version first. Versions are not part of the JSON file and do not move to other browsers.'}),
    el('h3',{text:'UML and BPMN'}),el('p',{text:'The UML library has class and interface boxes, actor, use case, package, component, node, note, lifeline, activation bar, states, decision, fork bar, frame and the relationship lines (generalization, realization, association, dependency, aggregation, composition, messages). In a class box the lines before the first -- are the name; each -- on its own line starts a new compartment. The BPMN library has events, task, sub-process, gateways, data object and store, pool, annotation, group and the flow lines. Both are drawn after common notation and marked as not checked against the OMG specifications.'}),
    el('h3',{text:'Match size'}),el('p',{text:'Select two or more shapes and use Arrange > Match width, Match height or Match size. The others take the size of the first shape you selected.'}),
    el('h3',{text:'Generic I/O modules'}),el('p',{text:'The Rockwell I/O modules (generic) library has a block for ControlLogix 1756, CompactLogix 5069 (Compact 5000), CompactLogix 1769 (Compact I/O) and POINT I/O 1734. When you drop or click one, Linework asks for the signal type (digital input, digital output, analog input or analog output) and the number of I/O points, 1 to 32. Every point has its own pin: hover the block to see the pins, then drag from a pin to another pin or shape. Pins on picks the edge: Left, Right, or Both sides (first half left, rest right). Automatic uses the left side up to 16 points and both sides above that. Type a slot or node name in the gray header (double-click it).'}),
    el('p',{text:'To change a placed block, select it and use I/O module in the right panel: family, signal type, points and Pins on. Lines stay on their points when the pins change sides. Commons adds up to four common pins (COM, or COM 0 to COM 3) below the points, drawn as filled terminals; on a two-sided card they alternate left and right. If you lower the point count, lines on the removed points stay where they were with a loose end. These blocks are generic placeholders, not specific catalog numbers, and are marked Unverified; real POINT I/O 1734 modules have 1 to 8 points each, so check the module wiring diagram.'}),
    el('h3',{text:'Wire terminals on symbols'}),el('p',{text:'Symbols with more than two wires have a pin for each terminal: 2-channel emergency stops and guard switches (11-12, 21-22), guard locking switches (A1-A2 solenoid, 11-12 and 21-22 contacts), coded switches, light curtains and laser scanners (+24V, 0V, OSSD1, OSSD2), enabling switches, two-hand controls, safety mats, safety relays, safety contactors, drives with STO, safety valves, stack lights, 3-pole breakers, disconnects, contactors and overloads (L1-L3, T1-T3), 3-phase motors, transformers (H1, H2, X1, X2), drives, the PLC I/O module, selector switches and the power supply. Hover the symbol to see its terminals and drag a line from one, or drop a line end near a terminal to pin it. The right panel lists which terminals have a wire. Terminal names are typical and marked Unverified, since they vary by product.'}),
    el('h3',{text:'Rotating shapes'}),el('p',{text:'Before you add a shape, pick Place at 0, 90, 180 or 270 in the library header; every shape you add from the library uses it. While dragging a tile, press R to turn the shape another 90\u00b0 (Shift+R the other way) before you drop it. After placing, click the round arrow button above the selection (Shift-click turns the other way), press Alt+R or Alt+Shift+R, or use Arrange > Rotate for 90\u00b0 steps. For any other angle, drag the round arrow button around the shape (it snaps every 15\u00b0; hold Shift for a free angle), or type the angle in Position and size > Angle. Lines stay attached and ports turn with the symbol. Text inside a shape turns with it; to keep it level, select the shape and set Text > When rotated to Stay level. Labels written beside electrical symbols always stay level so ladder drawings stay readable. Free angles apply to one shape at a time; orthogonal lines leave a turned shape from the nearest of its four sides.'}),
    el('h3',{text:'Electrical and safety devices'}),el('p',{text:'The Electrical library adds timed contacts (TC and TO), mushroom-head pushbuttons, 2 and 3 position selector switches, limit, pressure, temperature, float, flow and foot switches, proximity and photoelectric sensors, solenoid, horn, plug, 3-pole breaker, disconnect, contactor and overload, 3-phase motor, power supply, diode, LED, battery, meters, heater, current transformer and an IEC rectangle coil. The Electrical safety devices library, right below it, has emergency stops (1 and 2 channel), guard interlock and guard locking switches, coded non-contact switch, enabling switch, two-hand control, light curtain, laser scanner, safety mat and edge, safety relay, safety controller, safety contactor with mirror contact, drive with Safe Torque Off, redundant safety valve, stack light, lockout point, trapped key, guard fence and door, and a hazard warning triangle.'}),
    el('p',{text:'All of these drawings are marked Unverified in the right panel. The emergency stop follows the IEC 60617 description of symbol S00258 (mushroom head, positive opening, maintain position), but its proportions were not checked against the official graphic. Safety relay terminal names are typical, not from a particular product, so edit them to match the data sheet. Many safety devices have no single standard symbol and are drawn as labeled blocks.'}),
    el('h3',{text:'Pages'}),el('p',{text:'Use the tabs at the bottom to switch pages. The plus button adds a page, double-click a tab to rename it, and the x on the active tab deletes it (undo brings it back).'}),
    el('h3',{text:'Save and Save as'}),el('p',{text:'File > Save (Ctrl+S) and Save as (Ctrl+Shift+S) work like a desktop program. In Chrome and Edge, Save as opens the system Save dialog so you pick the folder and name, and after that Save writes straight back to that same file. Opening a .json with File > Open does the same, so Save updates the file you opened. The status at the top right shows the file name and whether there are unsaved changes, and the browser warns before you close the tab with unsaved changes. In browsers without that dialog (Firefox, Safari, and inside the claude.ai preview), Save as asks for a file name and the file goes to your Downloads folder.'}),
    el('h3',{text:'Importing Visio and Lucid files'}),el('p',{text:'File > Open or File > Import Visio or Lucid file (or drag the file onto the canvas) reads Visio .vsdx files and Lucid .lucid files (the Lucid Standard Import format, a ZIP holding document.json), as well as a bare Lucid document.json. Each page becomes a page. Shapes keep position, size, text, rotation and basic fill, line color and line width; Visio shape data and Lucid custom data become data fields; connectors stay attached to their shapes; groups stay grouped. Common flowchart shapes (decision, start/end, database, document and so on) are matched by name; anything else comes in as a rectangle, and pictures come in as [Picture] placeholders. Text formatting, themes, line routing points, master-shape artwork and Visio background pages are not carried over. Older binary .vsd files cannot be read: save them as .vsdx in Visio first. The imported diagram opens as a new, unsaved file, so the original is never overwritten. Check the result against the original.'}),
    el('h3',{text:'Templates'}),el('p',{text:'File > New from template, Insert > Template pages, the Templates button on the toolbar, or Browse templates on an empty canvas opens the gallery. Pick a category or search, then Use to open the template as your diagram (Ctrl+Z brings back what you had) or Add as page to add its pages to the open diagram. The gallery covers the same kinds of diagrams as Lucidchart\'s (flowcharts and processes, brainstorming, teams and organizations, projects and strategy, research and design, technical systems) plus an Industrial controls set: motor starter and P&ID, EtherNet/IP ring network, safety circuit, remote I/O panel and tank level loop. The templates are drawn for Linework, not copied from Lucidchart. Industrial templates are sketches to start from; check them against the product manuals and your standards.'}),
    el('h3',{text:'Device pictures'}),el('p',{text:'Select a Rockwell device (switch, controller, adapter, drive, HMI) and use Device picture > Add picture in the right panel, or drop a picture file onto the device. The picture shows on every shape of that catalog number in the diagram, the shape grows to fit it, the port pins stay on the edges, and lines stay attached. The catalog name moves under the shape. Untick Show the picture to hide it on one shape. Pictures are saved in the diagram file and, with Remember for new diagrams on, in this browser so new diagrams pick them up. Linework does not include product photos; use a photo or drawing you have the right to use.'}),
    el('h3',{text:'On a phone'}),el('p',{text:'On a narrow screen the shape library and the properties panel open as sheets from the bottom (the first and last toolbar buttons); only one is open at a time, and the library closes after you add a shape. Less used toolbar buttons are in the menus. Tap a shape to select it: its connection dots show without hovering, and handles are larger. Drag a dot to connect. Press and hold a shape or the canvas for its menu. Two fingers pan and pinch to zoom. Dialogs fill the screen.'}),
    el('h3',{text:'Folding branches (animated)'}),el('p',{text:'In a mind map or org chart, a topic or box with items under it shows a small round arrow button beside it (right side for mind maps, below for org charts). Click it to fold the branch: the items slide back into it and fade out, and the rest of the tree closes up. Click again to unfold: they slide out and fade in, and the view glides so the branch stays on screen. A folded button shows how many items are hidden. You can also use Alt+. on a selected topic, or the right-click menu (Fold branch, Fold all branches, Unfold all branches; also under View). Folded branches are saved with the diagram, hidden items are left out of exports, and the buttons work in Present mode too, where your folding is undone when you leave Present. Adding a topic to a folded branch unfolds it. If your system is set to reduce motion, branches change without the animation. The Collapsible mind map template shows a ready-made example.'}),
    el('h3',{text:'Icons'}),el('p',{text:'Insert > Icons, or search the library for icons:, shows five icon libraries (industrial and power, computers and network, people and places, arrows and marks, business) with 166 line icons. They act like any shape: resize, rotate, connect lines, and type a label under them. Border color sets the icon color, border width its line weight, and a fill color adds a rounded background tile. Icons are from the open-source Lucide set (ISC license; see Help > About).'}),
    el('h3',{text:'Freehand drawing'}),el('p',{text:'Click Draw on the toolbar (or Insert > Freehand drawing) to turn the pen on. Drag on the canvas to draw; each stroke becomes its own shape you can select, move, resize, rotate, recolor (Border color and width), group or delete later. The pen bar at the top sets the color and width, Highlighter draws wide see-through strokes, and Smooth rounds out the line. Two fingers still pan and zoom on a touch screen. Click Done or press Esc to turn the pen off.'}),
    el('h3',{text:'Electrical, IEC 60617 style'}),el('p',{text:'This library draws IEC style symbols vertically, with the leads at the top and bottom and the device tag to the right: make, break and changeover contacts, contactor, breaker, disconnector and switch-disconnector (single and 3-pole), fuse, thermal overload and its 95-96 trip contact, coils (plain, on-delay and off-delay), delayed contacts, pushbuttons, selector, position and proximity switches, lamp, horn, 3-phase motor, transformer, resistor, capacitor, diode, battery, earth and protective earth, terminal, and plug and socket. Multi-terminal symbols have pins named the usual IEC way (1-2, 3-4, 5-6 on main poles, A1-A2 on coils, 95-96 on the overload contact, U1 V1 W1 on the motor). All of them are marked Unverified: they follow the common published conventions but were not compared against the official IEC 60617 graphics.'}),
    el('h3',{text:'Dark mode'}),el('p',{text:'Dark mode (the moon button, or View > Dark mode) turns the canvas, the grid and the page sheet dark. Lines, symbols and unfilled shapes drawn in dark colors are shown light so you can read them; this is only how they look on screen. Saved colors, exports and Present mode stay as drawn, on white. A page with its own background color keeps that color in either mode.'}),
    el('h3',{text:'Mini map'}),el('p',{text:'View > Mini map shows a small overview in the bottom right corner of the canvas with every shape and line on the page and a blue box for what is on screen. Click or drag in the map to move the view there. The setting is remembered.'}),
    el('h3',{text:'Comments'}),el('p',{text:'View > Comments (Ctrl+Alt+M) opens the comments panel. Type your name once at the top. With one item selected, a new comment attaches to that item and its numbered pin follows the item; with nothing selected, the comment is pinned at the middle of the view. Press Enter to post (Shift+Enter for a new line). Reply, Resolve, Reopen and Delete work per thread, Show resolved brings resolved threads back, and clicking a pin or a thread number jumps to it. Comments are saved in the diagram file and undo like any other edit, but they are not live: other people see them when they open the file, and they are left out of SVG, PNG and PDF exports.'}),
    el('h3',{text:'Saving'}),el('p',{text:'Your diagram autosaves in this browser. The status at the top right tells you if browser storage is blocked. Use File > Save for a portable copy you can reopen anywhere, and File > Export SVG or PNG for images.'}),
    el('h3',{text:'On iPad'}),el('p',{text:'One finger on empty canvas pans, two fingers pinch to zoom. Drag shapes sideways out of the library onto the canvas (scrolling the library vertically still works). If the page opens from the Files app with nothing working, host the file instead: Quick Look blocks JavaScript.'}),
    el('h3',{text:'Keyboard and mouse'}),el('table',null,el('tbody',null,sc.map(r=>el('tr',null,el('td',{text:r[0]}),el('td',{text:r[1]}))))),

  group:groupSel, ungroup:ungroupSel, rotate:()=>rotateSel(false), rotateCcw:()=>rotateSel(true), flipH:()=>flipSel('h'), flipV:()=>flipSel('v'),

function runCmd(name){
  if(!name) return;
  if(name.startsWith('soon:')){ toast(name.slice(5)+' is coming soon.'); return; }
  if(name.startsWith('layer:')){ const p=name.split(':'); layerCmd(p[1],p[2]); return; }
  if(extraCmd(name)) return;
  if(name.startsWith('devpic:')){ const p=name.split(':'); if(p[1]==='set') pickDevPic(p[2]); else if(p[1]==='del') clearDevPic(p[2],S.prefs.picRemember!==false); return; }
  const f=CMDS[name]; if(f) f();
}

function wireChrome(){
  document.querySelectorAll('[data-icon]').forEach(b=>b.insertBefore(icon(b.getAttribute('data-icon')),b.firstChild));
  document.addEventListener('click',e=>{
    const c=e.target.closest&&e.target.closest('[data-cmd]');
    if(c&&!c.disabled&&!c.closest('#props [data-set]')){ closeMenus(); hideCtx(); runCmd(c.getAttribute('data-cmd')); }
  });
  const menus=$('.menus');
  menus.addEventListener('click',e=>{ const b=e.target.closest('[data-menu]'); if(!b) return; if(openMenu&&openMenu.btn===b) closeMenus(); else openMenuFor(b); });
  menus.addEventListener('pointerover',e=>{ const b=e.target.closest('[data-menu]'); if(b&&openMenu&&openMenu.btn!==b) openMenuFor(b); });
  document.addEventListener('pointerdown',e=>{
    if(openMenu&&!openMenu.el.contains(e.target)&&!e.target.closest('[data-menu]')) closeMenus();
    if(ctxEl&&!ctxEl.contains(e.target)) hideCtx();
    if(S.quick&&!S.quick.el.contains(e.target)&&!stage.contains(e.target)) closeQuick();

  const t=$('#docTitle');

  svg.addEventListener('pointerdown',onPointerDown);
  svg.addEventListener('pointermove',onPointerMove);
  svg.addEventListener('pointerup',onPointerUp);
  svg.addEventListener('pointercancel',onPointerUp);
  svg.addEventListener('pointerleave',()=>{ if(!S.op&&S.hover){ S.hover=null; invalidate({overlay:true}); } });

  svg.addEventListener('contextmenu',e=>{

    const it=e.target.closest&&e.target.closest('[data-id]');

}
function wireKeys(){
  document.addEventListener('keydown',e=>{
    const t=e.target, tag=t&&t.tagName;
    const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable);
    if(e.key==='Escape'){ if(modalEl){ closeModal(); return; }
      if(S.pen&&!typing){ e.preventDefault(); setPen(false); return; }
      if(ctxEl||openMenu){ hideCtx(); closeMenus(); return; }
      if(ftb.open&&!typing){ if(ftb.kind){ ftb.kind=null; buildFtbBar(); renderFtbPop(); invalidate({ftb:true}); } else hideFtb(); return; } closeMenus(); hideCtx(); closeQuick(); if(!typing&&S.sel.size) setSel([]); return; }
    if(typing||modalEl) return;
    const mod=e.ctrlKey||e.metaKey, k=(e.key||'').toLowerCase();

    if(e.key==='F5'&&!mod){ e.preventDefault(); startPresent(); return; }
    if(mod&&!e.shiftKey&&!e.altKey&&(k==='f'||k==='h')){ e.preventDefault(); openFind(); return; }
    if(mod&&e.altKey&&(e.code==='KeyC'||e.code==='KeyV')){ e.preventDefault(); runCmd(e.code==='KeyC'?'copyStyle':'pasteStyle'); return; }
    if(mod&&e.shiftKey&&(e.code==='KeyL')){ e.preventDefault(); runCmd('toggleLock'); return; }
    if(e.altKey&&!mod&&(e.key==='.'||e.code==='Period')){ e.preventDefault(); runCmd('foldSel'); return; }
    if(mod&&e.altKey&&e.code==='KeyM'){ e.preventDefault(); runCmd('comments'); return; }
    if(mod&&!e.shiftKey&&k==='k'){ e.preventDefault(); runCmd('openLink'); return; }
    if(e.key===' '){ e.preventDefault(); if(!S.spaceDown){ S.spaceDown=true; stage.classList.add('panning'); } return; }
    if(mod){
      const map={z:e.shiftKey?'redo':'undo',y:'redo',c:'copy',x:'cut',v:'paste',d:'duplicate',a:'selectAll',g:e.shiftKey?'ungroup':'group',s:e.shiftKey?'saveAs':'save',o:'openJson','=':'zoomIn','+':'zoomIn','-':'zoomOut','0':'zoom100',']':e.shiftKey?'front':'forward','[':e.shiftKey?'back':'backward','}':'front','{':'back'};
      const c=map[k]; if(c){ e.preventDefault(); runCmd(c); }
      return;
    }
    if(e.key==='Delete'||e.key==='Backspace'){ if(S.sel.size){ e.preventDefault(); deleteSel(); } return; }
    if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.code==='KeyR'){ e.preventDefault(); if(S.sel.size) rotateSel(e.shiftKey); return; }
    const arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
    if(arrows[e.key]){ if(S.sel.size){ e.preventDefault(); const m=e.shiftKey?10:1; nudge(arrows[e.key][0]*m,arrows[e.key][1]*m); } return; }
    if(e.shiftKey&&(e.code==='Digit1'||e.key==='!')){ e.preventDefault(); fitView(); return; }
    if(e.key==='?'){ e.preventDefault(); showHelp(); return; }
    const sel=selItems();
    if(e.key==='Tab'&&sel.length===1&&sel[0].family){ e.preventDefault(); addFamilyChild(sel[0],e.shiftKey); return; }
    if(e.key==='Enter'&&!e.shiftKey&&sel.length===1&&sel[0].family&&familyParent(sel[0])){ e.preventDefault(); addFamilyChild(sel[0],true); return; }
    if((e.key==='Enter'||e.key==='F2')&&sel.length===1){ e.preventDefault(); startEdit(sel[0].id); return; }
    if(e.key.length===1&&!e.altKey&&sel.length===1){ e.preventDefault(); startEdit(sel[0].id,e.key); }
  });
  document.addEventListener('keyup',e=>{ if(e.key===' '){ S.spaceDown=false; stage.classList.remove('panning'); } });
  window.addEventListener('blur',()=>{ S.spaceDown=false; stage.classList.remove('panning'); });
}
